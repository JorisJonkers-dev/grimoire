# Tag-triggered publish flow.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-image -> resolve-image-lock -> fragment
#
# The image lock crosses the reusable-workflow boundary as an UPLOADED ARTIFACT, never a
# runner-local path.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  # -- 1. Build and push the multi-arch container image ----------------------
  publish-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@f2180a482b63756affde537233881fa12e65df70 # v0.35.0
    with:
      image-name: grimoire
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  # -- 2. Resolve the images lock (upload artifact, never path) -------------
  resolve-image-lock:
    needs: [publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      fragment-images-lock-artifact: ${{ steps.lock.outputs.images-lock-artifact }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The commit the release was cut from, so the fragment names it however publish was started.
      - name: source-commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: resolve-image-digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/grimoire
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve a digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          platforms="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | join(",")')"
          case "$platforms" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) echo "Platforms: $platforms" ;;
            *) echo "E_SINGLE_ARCH: expected linux/amd64 and linux/arm64, got '$platforms'" >&2; exit 1 ;;
          esac
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

      # The images lock: the digest, under the alias the project file names, with the user the image
      # runs as and the version it ships, read back from what was pushed.
      - name: lock-fragment-image
        id: lock
        uses: JorisJonkers-dev/github-workflows/actions/resolve-image-lock@f2180a482b63756affde537233881fa12e65df70 # v0.35.0
        with:
          name: grimoire
          images: grimoire
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          artifact-name: fragment-images-lock-${{ github.run_id }}

  # -- 3. Publish the Intent Fragment the estate path composes ---------------
  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@f2180a482b63756affde537233881fa12e65df70 # v0.35.0
    with:
      project-file: deploy/grimoire.project.yml
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ needs.resolve-image-lock.outputs.source-sha }}
      validate-with: deploy/env
      validate-with-fragments: auth
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.fragment-images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
