# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# Every step runs `task` targets so CI and `task check` cannot drift. Steps carry
# `if: ${{ !cancelled() }}` so one failure still surfaces the rest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Install JS tooling
        run: task install

      - name: Lint Go
        if: ${{ !cancelled() }}
        run: task lint:go

      - name: Lint OpenAPI contract
        if: ${{ !cancelled() }}
        run: task lint:spec

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: task lint:actions

      - name: Test and coverage
        if: ${{ !cancelled() }}
        run: task coverage

      - name: Build
        if: ${{ !cancelled() }}
        run: task build

      - name: Secret scan
        if: ${{ !cancelled() }}
        run: task secrets
