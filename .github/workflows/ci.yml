# Parallel jobs in logical groups, ending in "Pipeline Complete", the only required check (estate
# convention). The repository is public, so standard runners cost nothing and parallel jobs buy wall-clock
# time. Steps run `task` targets so CI and `task check` cannot drift; steps within a job carry
# `if: ${{ !cancelled() }}` so one failure still surfaces the rest.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-go:
    name: Lint Go, migrations and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: go task golangci-lint github:sbdchd/squawk gitleaks
      - name: Lint Go
        run: task lint:go
      - name: Lint migrations
        if: ${{ !cancelled() }}
        run: task lint:sql
      - name: Secret scan
        if: ${{ !cancelled() }}
        run: task secrets

  contract:
    name: Contract, generated code and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: go node pnpm task sqlc actionlint go:github.com/daveshanley/vacuum
      - name: Install JS tooling
        run: task install
      - name: Lint OpenAPI contract
        if: ${{ !cancelled() }}
        run: task lint:spec
      - name: Generated code is current
        if: ${{ !cancelled() }}
        run: task gen:check
      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: task lint:actions

  lint-web:
    name: Lint web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: node pnpm task
      - name: Install JS tooling
        run: task install
      - name: Lint web
        run: task lint:web

  test-go:
    name: Go tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: go task go:github.com/vladopajic/go-test-coverage/v2
      - name: Go tests and coverage
        run: task coverage

  mutation:
    name: Mutation testing (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: go task
      - name: Mutation testing (rules engine)
        run: task mutation:${{ matrix.shard }}

  test-web:
    name: Web unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: node pnpm task
      - name: Web unit tests and coverage
        run: task test:web

  android:
    name: Android shell builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: node pnpm task
      - name: Install JS tooling
        run: task install
      - name: Build the web app
        run: pnpm --filter @grimoire/web build
      - name: Android shell builds
        run: JAVA_HOME="$JAVA_HOME_21_X64" task android

  image-stage:
    name: Image stage (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.target }} stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=image-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.target }}

  image:
    name: Container image builds
    needs: image-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from the cached stages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: grimoire:ci
          build-args: VERSION=ci
          cache-from: |
            type=gha,scope=image-web
            type=gha,scope=image-api

  e2e:
    name: End-to-end (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet, desktop, tv]
    env:
      GRIMOIRE_DATABASE_URL: postgres://grimoire:grimoire@localhost:5432/grimoire?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: grimoire
          POSTGRES_PASSWORD: grimoire
          POSTGRES_DB: grimoire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grimoire"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: true
          install_args: go node pnpm task
      - name: Install JS tooling
        run: task install
      - name: Build
        run: task build
      - name: Start API and web preview
        run: |
          GRIMOIRE_ADDR=:18765 GRIMOIRE_AUTO_MIGRATE=true GRIMOIRE_AUTO_IMPORT=true GRIMOIRE_DEV_SUBJECT=e2e-player GRIMOIRE_RATE_LIMIT_PER_MINUTE=100000 api/bin/grimoire serve > /tmp/api.log 2>&1 &
          GRIMOIRE_API_ORIGIN=http://localhost:18765 pnpm --filter @grimoire/web preview > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:18765/readyz >/dev/null && curl -sf http://localhost:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - name: End-to-end on ${{ matrix.device }}
        env:
          E2E_EXTERNAL_SERVERS: "1"
        run: |
          pnpm --filter @grimoire/web exec playwright install --with-deps chromium
          pnpm --filter @grimoire/web e2e --project=${{ matrix.device }}

  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [lint-go, contract, lint-web, test-go, mutation, test-web, android, image-stage, image, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
