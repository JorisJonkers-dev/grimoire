# Local Postgres for `task dev` and `task e2e`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grimoire
      POSTGRES_PASSWORD: grimoire
      POSTGRES_DB: grimoire
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grimoire"]
      interval: 2s
      retries: 20
