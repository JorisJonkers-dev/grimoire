# One command per loop (ARCHITECTURE.md §5). `task` lists targets; `task check` is what CI runs.
version: "3"

vars:
  DATABASE_URL: postgres://grimoire:grimoire@localhost:5432/grimoire?sslmode=disable

tasks:
  default:
    cmd: task --list
    silent: true

  install:
    desc: Install JS tooling from the frozen lockfile
    cmd: pnpm install --frozen-lockfile

  gen:
    desc: Regenerate code from the OpenAPI contract and SQL (ogen, sqlc, hey-api)
    cmds:
      - task: lint:spec
      - cd api && go generate ./internal/platform/...
      - cd api && sqlc generate
      - pnpm --filter @grimoire/web gen

  gen:check:
    desc: Fail if generated code is stale
    cmds:
      - task: gen
      - git diff --exit-code -- api/internal/platform/oas api/internal/platform/mcpapi/tools.json api/internal/platform/pg/queries web/src/infrastructure/api

  lint:
    desc: All linters
    cmds:
      - task: lint:go
      - task: lint:spec
      - task: lint:sql
      - task: lint:web
      - task: lint:actions

  lint:go:
    desc: golangci-lint (incl. depguard, exhaustive, gochecksumtype, exhaustruct) and format check
    dir: api
    cmds:
      - golangci-lint run ./...
      - golangci-lint fmt --diff ./...

  lint:spec:
    desc: OpenAPI conformance — Redocly recommended-strict, Spectral OWASP, vacuum
    deps: [install]
    cmds:
      - pnpm --filter @grimoire/openapi run lint
      - vacuum lint --details --fail-severity error openapi/v1/openapi.yaml

  lint:sql:
    desc: Migration safety lint (squawk)
    dir: api
    cmd: squawk db/migrations/*.sql

  lint:web:
    desc: ESLint (type-checked, a11y) and vue-tsc
    deps: [install]
    cmds:
      - pnpm --filter @grimoire/web lint
      - pnpm --filter @grimoire/web typecheck

  lint:actions:
    desc: actionlint on every workflow
    cmd: actionlint

  test:
    desc: Go tests (race, real Postgres via testcontainers) and web unit tests with coverage
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    dir: api
    cmd: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

  test:web:
    deps: [install]
    cmd: pnpm --filter @grimoire/web test

  coverage:
    desc: Enforce Go coverage thresholds (98% total, 100% rules); web thresholds live in vite.config.ts
    dir: api
    deps: [test:go]
    cmd: go-test-coverage --config .testcoverage.yml

  mutation:
    desc: Mutation testing (gremlins) on the rules engine; every mutant must be killed
    cmds:
      - task: mutation:1
      - task: mutation:2
      - task: mutation:3
      - task: mutation:4

  mutation:1:
    desc: Mutation testing, shard 1 of 4 (CI runs the shards in parallel)
    dir: api
    cmds:
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules

  mutation:2:
    desc: Mutation testing, shard 2 of 4 (CI runs the shards in parallel)
    dir: api
    cmds:
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/dice
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/hex
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/vision
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/combat

  mutation:3:
    desc: Mutation testing, shard 3 of 4 (CI runs the shards in parallel)
    dir: api
    cmds:
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/attack
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/tactics
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/effects

  mutation:4:
    desc: Mutation testing, shard 4 of 4 (CI runs the shards in parallel)
    dir: api
    cmds:
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/travel
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/surprise
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/encounters
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/loot
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/shops
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/surface
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/inventory
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/objects
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/movement
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/spellbuild
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/itembuild
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/subclassbuild
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/classbuild
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/speciesbuild
      - go tool gremlins unleash --threshold-efficacy 100 --timeout-coefficient 40 --workers 4 ./internal/rules/featbuild

  android:
    desc: Build the Capacitor Android shell as a debug APK from the web build (needs Java 21 and the Android SDK)
    dir: web
    cmds:
      - pnpm exec cap sync android
      - cd android && ./gradlew assembleDebug --no-daemon --quiet

  build:
    desc: Build the API binary and the web app
    cmds:
      - cd api && go build -trimpath -o bin/grimoire ./cmd/grimoire
      - pnpm --filter @grimoire/web build

  e2e:
    desc: Playwright device matrix against a local stack (starts Postgres with Docker Compose)
    cmds:
      - docker compose up -d --wait postgres
      - pnpm --filter @grimoire/web exec playwright install chromium
      - pnpm --filter @grimoire/web e2e

  secrets:
    desc: Scan the working tree for secrets
    cmd: gitleaks dir --no-banner --redact .

  check:
    desc: Everything CI runs on a pull request except E2E
    cmds:
      - task: lint
      - task: gen:check
      - task: coverage
      - task: test:web
      - task: build
      - task: secrets

  fix:
    desc: Apply formatters and autofixes
    cmds:
      - cd api && golangci-lint fmt ./...
      - cd api && golangci-lint run --fix ./...
      - pnpm --filter @grimoire/web exec eslint . --fix

  dev:
    desc: Run Postgres, the API with the dev identity, and Vite
    cmds:
      - docker compose up -d --wait postgres
      - cmd: GRIMOIRE_DATABASE_URL='{{.DATABASE_URL}}' GRIMOIRE_AUTO_MIGRATE=true GRIMOIRE_AUTO_IMPORT=true GRIMOIRE_DEV_SUBJECT=dev-dm go run ./cmd/grimoire serve & pnpm --filter @grimoire/web dev
        dir: api
