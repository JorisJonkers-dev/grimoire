# Coverage gate (ARCHITECTURE.md §17.2): 98% overall, 100% for the pure rules engine.
profile: coverage.out
local-prefix: github.com/JorisJonkers-dev/grimoire/api
threshold:
  total: 98
override:
  - path: ^internal/rules/
    threshold: 100
exclude:
  paths:
    - ^cmd/                        # composition root, exercised by E2E
    - /oas/                        # ogen-generated
    - /queries/                    # sqlc-generated
    - /pgtest/                     # test helper
    - /oidctest/                   # test helper
