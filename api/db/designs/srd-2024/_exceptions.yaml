# The approved Manual exception list (#244). Only the maintainer changes it.
# ground: dm_knowledge (knowledge only the DM holds), on_the_spot (content authored on the spot) or
# free_form (how a creature pursues a free-form instruction or bargain).
# Every other part of a listed entry is automated as usual.

