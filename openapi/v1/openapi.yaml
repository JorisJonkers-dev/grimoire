    LibraryCollectionUpdate:
      type: object
      description: A Collection's name, description and the entries it holds.
      additionalProperties: false
      required: [name, entryIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        entryIds:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    LibrarySwitchInput:
      type: object
      description: Whether the Collection is on in the Campaign.
      additionalProperties: false
      required: ["on"]
      properties:
        "on": { type: boolean }
    LibraryLinkInput:
      type: object
      description: The entry to link.
      additionalProperties: false
      required: [entryId]
      properties:
        entryId: { $ref: "#/components/schemas/Id" }
    CampaignOverrideInput:
      type: object
      description: Every field this Campaign sees differently; an empty list follows the base again.
      additionalProperties: false
      required: [fields]
      properties:
        fields: { $ref: "#/components/schemas/LibraryFields" }
    LibraryPinInput:
      type: object
      description: The Revision to pin.
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int32, minimum: 1, maximum: 1000000 }
    ProposalStatus:
      type: string
      description: Where a Proposal stands.
      enum: [pending, changes_requested, approved, declined]
    Proposal:
      type: object
      description: A Player's request that the DM accept a new entry into a Campaign, or a change to one it sees (baseEntryId). entryId is the Library entry an approval made or changed.
      additionalProperties: false
      required: [id, kind, name, fields, note, authorName, status, message, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        name: { type: string, maxLength: 80 }
        fields: { $ref: "#/components/schemas/LibraryFields" }
        note: { type: string, maxLength: 2000 }
        authorName: { type: string, maxLength: 80 }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        message: { type: string, maxLength: 2000, description: "The DM's latest message." }
        baseEntryId: { $ref: "#/components/schemas/Id" }
        entryId: { $ref: "#/components/schemas/Id" }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    ProposalStep:
      type: object
      description: One step of a Proposal's history.
      additionalProperties: false
      required: [no, action, message, by, createdAt]
      properties:
        no: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        action: { type: string, enum: [submitted, resubmitted, changes_requested, approved, declined] }
        message: { type: string, maxLength: 2000 }
        by: { type: string, maxLength: 80 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
    ProposalDetail:
      type: object
      description: A Proposal with its history and, for a change, the entry as the Campaign sees it now, for a side-by-side review.
      additionalProperties: false
      required: [proposal, steps]
      properties:
        proposal: { $ref: "#/components/schemas/Proposal" }
        steps:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ProposalStep" }
        current: { $ref: "#/components/schemas/LinkedEntry" }
    ProposalInput:
      type: object
      description: A new entry to propose, or a change to the entry baseEntryId.
      additionalProperties: false
      required: [kind, name, fields]
      properties:
        kind: { $ref: "#/components/schemas/LibraryKind" }
        name: { type: string, minLength: 1, maxLength: 80 }
        fields: { $ref: "#/components/schemas/LibraryFields" }
        note: { type: string, maxLength: 2000 }
        baseEntryId: { $ref: "#/components/schemas/Id" }
    ProposalUpdate:
      type: object
      description: A Proposal changed as the DM asked.
      additionalProperties: false
      required: [name, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        fields: { $ref: "#/components/schemas/LibraryFields" }
        note: { type: string, maxLength: 2000 }
    ProposalReviewInput:
      type: object
      description: A DM's decision; an approval may edit the name and fields first.
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [approve, request_changes, decline] }
        message: { type: string, maxLength: 2000 }
        name: { type: string, minLength: 1, maxLength: 80 }
        fields: { $ref: "#/components/schemas/LibraryFields" }
    LiveContainer:
      type: object
      description: A Character's Inventory, the Party Stash, a drop of loot, or a bag inside another container, with what it weighs including its bags. A Character's names its owner and how much they can carry.
      additionalProperties: false
      required: [id, kind, label, items, instances, coins, weightLb]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [character, party_stash, loot_drop, bag] }
        label: { type: string, maxLength: 80 }
        characterId: { $ref: "#/components/schemas/Id" }
        ownerId: { $ref: "#/components/schemas/Id" }
        parentId: { $ref: "#/components/schemas/Id" }
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveItem" }
        instances:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveItemInstance" }
        coins:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/LiveCoins" }
        weightLb: { type: number, format: double, minimum: 0, maximum: 100000000 }
        capacityLb: { type: number, format: double, minimum: 0, maximum: 100000 }
        encumbered: { type: boolean }
        claims:
          type: array
          description: The calls on a loot pile's items, earliest first.
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveClaim" }
    LiveClaim:
      type: object
      description: A Character's need or greed call on a loot pile's item, with the d20 it rolled. Need beats greed, then the higher roll, then the earlier claim.
      additionalProperties: false
      required: [characterId, name, item, choice, roll]
      properties:
        characterId: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        item: { type: string, maxLength: 80, description: "A plain stack's slug or an Item Instance's id." }
        choice: { type: string, enum: [need, greed] }
        roll: { type: integer, format: int32, minimum: 1, maximum: 20 }
    LiveItem:
      type: object
      description: A stack of one item and what it weighs in all.
      additionalProperties: false
      required: [slug, name, count, weightLb]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        count: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        weightLb: { type: number, format: double, minimum: 0, maximum: 100000000 }
    LiveRest:
      type: object
      description: The rest the party proposed or is taking. It starts once the DM and every Player resting a Character agree; a Short Rest spends Hit Dice.
      additionalProperties: false
      required: [kind, status, proposedBy, agreed, waiting, waitingOnDm, resters]
      properties:
        kind: { type: string, enum: [short, long] }
        status: { type: string, enum: [proposed, resting] }
        proposedBy: { $ref: "#/components/schemas/Id" }
        agreed:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Id" }
        waiting:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Id" }
        waitingOnDm: { type: boolean }
        resters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LiveRester" }
    LiveRester:
      type: object
      description: A resting Character, their Hit Die, how many are left, and the roll of one being spent.
      additionalProperties: false
      required: [characterId, tokenId, name, hitDie, hitDiceLeft]
      properties:
        characterId: { $ref: "#/components/schemas/Id" }
        tokenId: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        hitDie: { type: string, enum: [d6, d8, d10, d12] }
        hitDiceLeft: { type: integer, format: int32, minimum: 0, maximum: 20 }
        rollId: { $ref: "#/components/schemas/Id" }
    LiveItemInstance:
      type: object
      description: One Item Instance. Only the DM sees an unidentified item's own name and Charges; the party sees the base item.
      additionalProperties: false
      required: [id, slug, name, count, identified, weightLb]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        count: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        charges: { type: integer, format: int32, minimum: 0, maximum: 100 }
        identified: { type: boolean }
        attuned: { type: boolean }
        slot: { type: string, enum: [main_hand, off_hand, ranged_main, ranged_off, armor, head, cloak, hands, feet, neck, ring_1, ring_2] }
        weightLb: { type: number, format: double, minimum: 0, maximum: 100000000 }
    LiveCoins:
      type: object
      description: How many coins of one kind a container holds.
      additionalProperties: false
      required: [coin, count]
      properties:
        coin: { $ref: "#/components/schemas/Coin" }
        count: { type: integer, format: int32, minimum: 1, maximum: 10000000 }
    LiveShop:
      type: object
      description: The Shop open in the Session, its Stock at asking prices in copper, and each Character's haggling.
      additionalProperties: false
      required: [id, name, kind, settlement, stock, haggles, offers]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        kind: { type: string, maxLength: 40 }
        settlement: { type: string, maxLength: 80 }
        owner: { type: string, maxLength: 80 }
        stock:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/LiveStock" }
        haggles:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LiveHaggle" }
        offers:
          type: array
          description: What the Shop pays each Character for the items in its pack, after its haggle.
          maxItems: 2000
          items: { $ref: "#/components/schemas/LiveOffer" }
    LiveOffer:
      type: object
      description: What the open Shop pays a Character for one of an item; junk marks wares sold off in one go.
      additionalProperties: false
      required: [characterId, slug, priceCp]
      properties:
        characterId: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        priceCp: { type: integer, format: int32, minimum: 0, maximum: 100000000 }
        junk: { type: boolean }
    LiveTradeLine:
      type: object
      description: How many of an item a trade buys or sells.
      additionalProperties: false
      required: [itemSlug, count]
      properties:
        itemSlug: { $ref: "#/components/schemas/Slug" }
        count: { type: integer, format: int32, minimum: 0, maximum: 100000 }
    LiveStock:
      type: object
      description: One item the open Shop sells, and its asking price in copper before haggling.
      additionalProperties: false
      required: [slug, name, count, priceCp, weightLb]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        count: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        priceCp: { type: integer, format: int32, minimum: 1, maximum: 100000000 }
        weightLb: { type: number, format: double, minimum: 0, maximum: 100000000 }
    LiveHaggle:
      type: object
      description: A Character's haggling with the open Shop. While the roll is out it names the roll; once rolled, the price adjustment in percent.
      additionalProperties: false
      required: [characterId]
      properties:
        characterId: { $ref: "#/components/schemas/Id" }
        rollId: { $ref: "#/components/schemas/Id" }
        adjustPct: { type: integer, format: int32, minimum: -100, maximum: 100 }
    LiveCheck:
      type: object
      description: An Encounter Check. Everyone sees what set it off and its outcome, and an open check's roll; only the DM sees its table, mode, seed, entry and creatures.
      additionalProperties: false
      required: [id, trigger, visibility, status]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        trigger: { $ref: "#/components/schemas/EncounterTrigger" }
        visibility: { $ref: "#/components/schemas/EncounterVisibility" }
        status: { type: string, enum: [pending, resolved] }
        outcome: { type: string, enum: [encounter, nothing] }
        chancePct: { type: integer, format: int32, minimum: 0, maximum: 100 }
        chanceRoll: { type: integer, format: int32, minimum: 1, maximum: 100 }
        rollId: { $ref: "#/components/schemas/Id" }
        tableName: { type: string, maxLength: 80 }
        mode: { $ref: "#/components/schemas/EncounterMode" }
        seed: { type: string, maxLength: 20 }
        entryLabel: { type: string, maxLength: 120 }
        monsters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LiveCheckMonster" }
    LiveCheckMonster:
      type: object
      description: How many of one creature a check produced.
      additionalProperties: false
      required: [slug, count]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        count: { type: integer, format: int32, minimum: 1, maximum: 100 }
    LiveZone:
      type: object
      description: An Encounter Zone, for the DM only. creatures counts the hidden creatures in it, or those it held once sprung; dc is their Stealth DC once it springs.
      additionalProperties: false
      required: [id, name, q, r, radiusHexes, dmOnly, held, status, creatures, checks]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 40 }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        radiusHexes: { type: integer, format: int32, minimum: 1, maximum: 20 }
        dmOnly: { type: boolean }
        held: { type: boolean }
        status: { type: string, enum: [armed, spotting, sprung] }
        dc: { type: integer, format: int32, minimum: 0, maximum: 50 }
        creatures: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        checks:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveZoneCheck" }
    LiveZoneCheck:
      type: object
      description: Whether one party member noticed a sprung zone; noticed is absent while they roll.
      additionalProperties: false
      required: [tokenId]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        noticed: { type: boolean }
    LivePerception:
      type: object
      description: A party member's Perception Roll Card after a zone springs. The DC is never sent.
      additionalProperties: false
      required: [rollId, tokenId]
      properties:
        rollId: { $ref: "#/components/schemas/Id" }
        tokenId: { $ref: "#/components/schemas/Id" }
    TravelPace:
      type: string
      description: How fast the party travels overland; slow, normal and fast cover 2, 3 and 4 miles an hour for 8 hours a day.
      enum: [slow, normal, fast]
    LiveWorld:
      type: object
      description: The world map the party travels. The DM gets every location and route; players and the Table get the locations the party has seen or can reach from where it stands, and the routes between them.
      additionalProperties: false
      required: [map, revealed, nodes, routes, legs]
      properties:
        map: { $ref: "#/components/schemas/LiveMap" }
        revealed:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        nodes:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveWorldNode" }
        routes:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/LiveWorldRoute" }
        partyNodeId: { $ref: "#/components/schemas/Id" }
        legs:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/LiveTravelLeg" }
    LiveWorldNode:
      type: object
      description: A named location on the world map.
      additionalProperties: false
      required: [id, name, q, r]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 40 }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
    LiveWorldRoute:
      type: object
      description: A route between two locations, travelled either way, with how long it takes at each pace.
      additionalProperties: false
      required: [id, fromNodeId, toNodeId, distanceMi, plans]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        fromNodeId: { $ref: "#/components/schemas/Id" }
        toNodeId: { $ref: "#/components/schemas/Id" }
        distanceMi: { type: integer, format: int32, minimum: 1, maximum: 2000 }
        plans:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/LiveTravelPlan" }
    LiveTravelPlan:
      type: object
      description: How long a route takes at one pace, in minutes on the road and the travel days they span.
      additionalProperties: false
      required: [pace, minutes, days]
      properties:
        pace: { $ref: "#/components/schemas/TravelPace" }
        minutes: { type: integer, format: int32, minimum: 0, maximum: 100000 }
        days: { type: integer, format: int32, minimum: 0, maximum: 1000 }
    LiveTravelLeg:
      type: object
      description: One Travel Leg the party made this Session.
      additionalProperties: false
      required: [from, to, pace, distanceMi, minutes, days]
      properties:
        from: { type: string, maxLength: 40 }
        to: { type: string, maxLength: 40 }
        pace: { $ref: "#/components/schemas/TravelPace" }
        distanceMi: { type: integer, format: int32, minimum: 1, maximum: 2000 }
        minutes: { type: integer, format: int32, minimum: 0, maximum: 100000 }
        days: { type: integer, format: int32, minimum: 0, maximum: 1000 }
    TableCamera:
      type: string
      description: How the Table Display's camera moves.
      enum: [follow_turn, show_party, free]
    TableScene:
      type: string
      description: What the Table Display shows.
      enum: [local, world, handout, title]
    LiveTable:
      type: object
      description: What the Table Display shows. q, r and zoomPct steer the free camera; the world scene shows worldMap.
      additionalProperties: false
      required: [camera, q, r, zoomPct, scene, blackout]
      properties:
        camera: { $ref: "#/components/schemas/TableCamera" }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        zoomPct: { type: integer, format: int32, minimum: 50, maximum: 300 }
        scene: { $ref: "#/components/schemas/TableScene" }
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 1000 }
        worldMap: { $ref: "#/components/schemas/LiveMap" }
        blackout: { type: boolean }
    LiveAreaPreview:
      type: object
      description: An area spell's hexes and every creature it would catch, allies flagged, sent only to whoever asked.
      additionalProperties: false
      required: [tokenId, effect, name, dc, hexes, targets, allies]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        effect: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 80 }
        dc: { type: integer, format: int32, minimum: 1, maximum: 40 }
        hexes:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/HexCoord" }
        targets:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/LiveAreaTarget" }
        allies: { type: integer, format: int32, minimum: 0, maximum: 200 }
        ends:
          type: array
          description: The Effects the caster concentrates on that casting this spell would end.
          maxItems: 10
          items: { type: string, maxLength: 80 }
    LiveAreaTarget:
      type: object
      description: A creature an area catches.
      additionalProperties: false
      required: [tokenId, ally]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        ally: { type: boolean }
        pushedTo: { $ref: "#/components/schemas/HexCoord" }
    LiveArea:
      type: object
      description: An area spell waiting on its damage roll and saving throws.
      additionalProperties: false
      required: [casterId, name, hexes, saves]
      properties:
        casterId: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        hexes:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/HexCoord" }
        damageRollId: { $ref: "#/components/schemas/Id" }
        saves:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/LiveAreaSave" }
    LiveAreaSave:
      type: object
      description: One target's saving throw against an area.
      additionalProperties: false
      required: [tokenId]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        rollId: { $ref: "#/components/schemas/Id" }
    LiveSurface:
      type: object
      description: A Surface on a hex.
      additionalProperties: false
      required: [q, r, kind]
      properties:
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        kind: { type: string, maxLength: 40, pattern: "^[a-z][a-z0-9-]{0,39}$", description: "A Surface from the catalogue." }
        roundsLeft: { type: integer, format: int32, minimum: 1, maximum: 100 }
    LiveElevation:
      type: object
      description: A raised or sunken hex.
      additionalProperties: false
      required: [q, r, elevationFt]
      properties:
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        elevationFt: { type: integer, format: int32, minimum: -100, maximum: 100 }
    LiveObject:
      type: object
      description: A Map Object; its numbers, trigger and secrecy go to the DM only.
      additionalProperties: false
      required: [id, kind, name, q, r, open, broken]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/MapObjectKind" }
        name: { type: string, maxLength: 40 }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        open: { type: boolean, description: "Open, or pulled for a lever." }
        broken: { type: boolean }
        secret: { type: boolean }
        ac: { type: integer, format: int32, minimum: 1, maximum: 30 }
        hp: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        hpMax: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        effect: { type: string, maxLength: 80 }
        radiusFt: { type: integer, format: int32, minimum: 0, maximum: 60 }
        locked: { type: boolean }
        armed: { type: boolean }
        detectDc: { type: integer, format: int32, minimum: 1, maximum: 40 }
        disarmDc: { type: integer, format: int32, minimum: 1, maximum: 40 }
        triggerFt: { type: integer, format: int32, minimum: 1, maximum: 60 }
        lockDc: { type: integer, format: int32, minimum: 1, maximum: 40 }
        key: { type: string, maxLength: 80 }
    MapObjectKind:
      type: string
      enum: [door, lever, chest, barrel, curtain, destructible, trap]
    LiveQuality:
      type: object
      description: One Visibility Quality of a token, and whether the party has seen through it with a check.
      additionalProperties: false
      required: [quality]
      properties:
        quality: { $ref: "#/components/schemas/VisibilityQuality" }
        seenThrough: { type: boolean }
    VisibilityQuality:
      type: string
      description: Something that keeps a creature or object from being seen for what it is.
      enum: [hidden, invisible, disguised, illusory, ethereal, darkness, heavy, secret]
    LiveEffect:
      type: object
      description: An Effect on a token, which everyone who sees the token sees.
      additionalProperties: false
      required: [id, slug, name, concentration]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 80 }
        sourceId: { $ref: "#/components/schemas/Id" }
        concentration: { type: boolean }
        roundsLeft: { type: integer, format: int32, minimum: 1, maximum: 100 }
        level: { type: integer, format: int32, minimum: 1, maximum: 10, description: "Levels of a stacking Effect, such as exhaustion." }
        mode: { type: string, maxLength: 80, description: "The option chosen when the Effect offers a choice." }
        hexes:
          type: array
          description: The hexes an emanation covers around the token where it stands now; it moves with the token.
          maxItems: 2000
          items: { $ref: "#/components/schemas/HexCoord" }
    LiveManual:
      type: object
      description: Part of an Effect the engine cannot compute, for the DM to resolve by hand.
      additionalProperties: false
      required: [id, text]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        text: { type: string, maxLength: 300 }
    LiveSave:
      type: object
      description: A saving throw waiting on its Roll Card to end an Effect.
      additionalProperties: false
      required: [rollId, tokenId, effect, dc]
      properties:
        rollId: { $ref: "#/components/schemas/Id" }
        tokenId: { $ref: "#/components/schemas/Id" }
        effect: { type: string, maxLength: 80 }
        dc: { type: integer, format: int32, minimum: 1, maximum: 40 }
    Tactics:
      type: string
      description: How a creature picks Suggested Actions; auto follows its Intelligence (Cunning from 12).
      enum: [auto, simple, cunning, off]
    LiveSuggestion:
      type: object
      description: A creature's Suggested Action for the DM. Without attackNo nothing reaches yet and it should close in on the target.
      additionalProperties: false
      required: [targetId, reason]
      properties:
        attackNo: { type: integer, format: int32, minimum: 0, maximum: 50 }
        targetId: { $ref: "#/components/schemas/Id" }
        reason: { type: string, maxLength: 200 }
    LiveCombatantSetup:
      type: object
      description: A Token joining a Combat, with its initiative bonus and speed.
      additionalProperties: false
      required: [tokenId, initiativeBonus, speedFt]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        initiativeBonus: { type: integer, format: int32, minimum: -10, maximum: 20 }
        speedFt: { type: integer, format: int32, minimum: 0, maximum: 120 }
    LiveCombat:
      type: object
      description: The running Combat, with every Combatant the audience can see in turn order. Tied initiatives share a rank and act at the same time.
      additionalProperties: false
      required: [status, round, combatants]
      properties:
        status: { type: string, enum: [rolling, active] }
        round: { type: integer, format: int32, minimum: 0, maximum: 100000 }
        combatants:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LiveCombatant" }
        attack: { $ref: "#/components/schemas/LivePendingAttack" }
        prompt: { $ref: "#/components/schemas/LivePrompt" }
    LivePrompt:
      type: object
      description: A Reaction Prompt the fight waits on. The reactor's Controller, or the DM, answers; no answer by the countdown declines.
      additionalProperties: false
      required: [id, kind, reactorId, triggerId, effect, secondsLeft]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [opportunity_attack, shield, readied, effect] }
        reactorId: { $ref: "#/components/schemas/Id" }
        triggerId: { $ref: "#/components/schemas/Id" }
        effect: { type: string, maxLength: 300 }
        secondsLeft: { type: integer, format: int32, minimum: 0, maximum: 120 }
    LiveCombatant:
      type: object
      description: One Combatant in the initiative rail, with what is left of its action economy.
      additionalProperties: false
      required: [id, tokenId, label, kind, rollId, acting, done, action, bonusAction, reaction, movementFt, speedFt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        tokenId: { $ref: "#/components/schemas/Id" }
        label: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: "#/components/schemas/TokenKind" }
        controllerId: { $ref: "#/components/schemas/Id" }
        rollId: { $ref: "#/components/schemas/Id" }
        initiative: { type: integer, format: int32, minimum: -20, maximum: 60 }
        rank: { type: integer, format: int32, minimum: 1, maximum: 50 }
        acting: { type: boolean }
        done: { type: boolean }
        action: { type: boolean }
        bonusAction: { type: boolean }
        reaction: { type: boolean }
        movementFt: { type: integer, format: int32, minimum: 0, maximum: 120 }
        speedFt: { type: integer, format: int32, minimum: 0, maximum: 120 }
        surprised: { type: boolean, description: "Did not notice the ambush and rolled initiative at disadvantage." }
        disengaged: { type: boolean, description: "Moves without provoking opportunity attacks until its next turn." }
        readied: { type: boolean, description: "Has a readied attack waiting on its trigger; the party sees only its own." }
        attacksLeft: { type: integer, format: int32, minimum: 0, maximum: 10, description: "Attacks left of an Attack action already begun (Extra Attack)." }
        offHand: { type: boolean, description: "The off-hand attack of a Light weapon is open." }
        interaction: { type: boolean, description: "The turn's free object interaction is unused." }
        cleave: { type: boolean, description: "A Cleave hit leaves a second attack open." }
        ownerId: { $ref: "#/components/schemas/Id" }
        awaitingCommand: { type: boolean, description: "A summoned creature that only Dodges until its owner commands it with a Bonus Action." }
        tactics: { $ref: "#/components/schemas/Tactics" }
        suggestion: { $ref: "#/components/schemas/LiveSuggestion" }
    LiveUpdate:
      type: object
      description: A WebSocket frame from a live Session. Snapshots answer joins and resyncs; a view follows every change, and a view whose seq is not the next one means resync. A walk's view carries the views along the way as steps, to play back at walking pace; a path answers plan_walk to its sender only.
      additionalProperties: false
      required: [kind, seq]
      properties:
        kind: { type: string, enum: [snapshot, view, rejected, ended, path, attack_preview, area_preview, ping] }
        seq: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
        nonce: { type: string, maxLength: 64 }
        actionSeq: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
        reason: { type: string, maxLength: 200 }
        session: { $ref: "#/components/schemas/LiveSessionView" }
        view: { $ref: "#/components/schemas/LiveView" }
        steps:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/LiveView" }
        path: { $ref: "#/components/schemas/LivePath" }
        preview: { $ref: "#/components/schemas/LiveAttackPreview" }
        area: { $ref: "#/components/schemas/LiveAreaPreview" }
        ping: { $ref: "#/components/schemas/HexCoord" }
    LivePath:
      type: object
      description: The route a walk would take, start first, and the movement it costs.
      additionalProperties: false
      required: [tokenId, hexes, costFt]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        hexes:
          type: array
          maxItems: 61
          items: { $ref: "#/components/schemas/HexCoord" }
        costFt: { type: integer, format: int32, minimum: 0, maximum: 1000 }
    MapKind:
      type: string
      description: A local tactical map, or a world map of locations and routes.
      enum: [local, world]
    AmbientLight:
      type: string
      description: The light that fills a Map everywhere.
      enum: [bright, dim, dark]
    LiveMap:
      type: object
      description: The active Map's picture and hex calibration.
      additionalProperties: false
      required: [id, name, imageUrl, width, height, hexSizePx, originX, originY, imageVersion]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        imageUrl: { $ref: "#/components/schemas/AssetUrl" }
        width: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        height: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        hexSizePx: { type: number, format: double, minimum: 8, maximum: 400 }
        originX: { type: number, format: double, minimum: -100000, maximum: 100000 }
        originY: { type: number, format: double, minimum: -100000, maximum: 100000 }
        imageVersion: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
    LiveLight:
      type: object
      description: A light on the Map, for the DM.
      additionalProperties: false
      required: [id, q, r, brightFt, dimFt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        brightFt: { type: integer, format: int32, minimum: 0, maximum: 600 }
        dimFt: { type: integer, format: int32, minimum: 0, maximum: 600 }
    LiveView:
      type: object
      description: What one audience may see now. With fog, a hex is visible now, remembered, or in neither list because the party never saw it; nothing in it is sent. Walls, lights and ambient go to the DM only.
      additionalProperties: false
      required: [tokens, fog, visible, remembered]
      properties:
        tokens:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveToken" }
        map: { $ref: "#/components/schemas/LiveMap" }
        fog: { type: boolean }
        visible:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        remembered:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        combat: { $ref: "#/components/schemas/LiveCombat" }
        manual:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LiveManual" }
        resolving: { type: boolean, description: "The DM is resolving part of an Effect by hand." }
        saves:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/LiveSave" }
        surfaces:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/LiveSurface" }
        elevation:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/LiveElevation" }
        area: { $ref: "#/components/schemas/LiveArea" }
        table: { $ref: "#/components/schemas/LiveTable" }
        world: { $ref: "#/components/schemas/LiveWorld" }
        sneak:
          type: object
          description: The party sneaking with a group Stealth check; Reach is where the creatures the audience sees would notice it.
          additionalProperties: false
          required: [waiting, reach]
          properties:
            waiting: { type: boolean, description: "Stealth rolls are still out." }
            reach:
              type: array
              maxItems: 4000
              items: { $ref: "#/components/schemas/HexCoord" }
            totals:
              type: object
              description: Each member's Stealth total by token id, for the DM only.
              maxProperties: 50
              additionalProperties: { type: integer, format: int32, minimum: -20, maximum: 80 }
        exploration:
          type: object
          description: Exploration in turns, outside a fight.
          additionalProperties: false
          required: [order, turn, leftFt]
          properties:
            order: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Id" } }
            turn: { $ref: "#/components/schemas/Id" }
            leftFt: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        surfaceKinds:
          type: array
          description: The Surface catalogue, for the DM's paint tool.
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [kind, name]
            properties:
              kind: { type: string, maxLength: 40 }
              name: { type: string, maxLength: 40 }
        objects:
          type: array
          description: The Map Objects the audience knows; the party never gets secret ones or ones outside what it has seen.
          maxItems: 500
          items: { $ref: "#/components/schemas/LiveObject" }
        zones:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/LiveZone" }
        perception:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LivePerception" }
        checks:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/LiveCheck" }
        inventory:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveContainer" }
        shop: { $ref: "#/components/schemas/LiveShop" }
        rest: { $ref: "#/components/schemas/LiveRest" }
        gameDay: { type: integer, format: int32, minimum: 0, maximum: 1000000, description: "Days passed in the Campaign; a long rest or travel moves it on." }
        walls:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        lights:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/LiveLight" }
        ambient: { $ref: "#/components/schemas/AmbientLight" }
    LocalMap:
      type: object
      description: An uploaded Map and its hex calibration.
      additionalProperties: false
      required: [id, name, kind, width, height, hexSizePx, originX, originY, ambient, imageUrl]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        kind: { $ref: "#/components/schemas/MapKind" }
        width: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        height: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        hexSizePx: { type: number, format: double, minimum: 8, maximum: 400 }
        originX: { type: number, format: double, minimum: -100000, maximum: 100000 }
        originY: { type: number, format: double, minimum: -100000, maximum: 100000 }
        ambient: { $ref: "#/components/schemas/AmbientLight" }
        imageUrl: { $ref: "#/components/schemas/AssetUrl" }
    MapEdit:
      type: object
      description: A Map's name, calibration and ambient light.
      additionalProperties: false
      required: [name, hexSizePx, originX, originY, ambient]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        hexSizePx: { type: number, format: double, minimum: 8, maximum: 400 }
        originX: { type: number, format: double, minimum: -100000, maximum: 100000 }
        originY: { type: number, format: double, minimum: -100000, maximum: 100000 }
        ambient: { $ref: "#/components/schemas/AmbientLight" }
    Slug:
      type: string
      description: Lower-case, hyphenated identifier.
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    Ruleset:
      type: string
      description: Rules document key.
      enum: [srd-2024, srd-2014]
    CampaignRuleset:
      type: string
      description: The rules a Campaign plays by. Grimoire runs SRD 5.2 only; the earlier ruleset stays readable in the compendium.
      enum: [srd-2024]
    SpellSummary:
      type: object
      description: A spell as it appears in a list.
      additionalProperties: false
      required: [slug, name, level, school, ruleset, ritual, concentration]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        level: { type: integer, format: int32, minimum: 0, maximum: 9 }
        school: { $ref: "#/components/schemas/Slug" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        ritual: { type: boolean }
        concentration: { type: boolean }
    SpellPage:
      type: object
      description: One page of spells.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SpellSummary" }
        nextCursor:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_-]+$"
    SpellScaling:
      type: object
      description: Damage at a higher slot or character level.
      additionalProperties: false
      required: [kind, level, damageRoll]
      properties:
        kind: { type: string, enum: [slot, character] }
        level: { type: integer, format: int32, minimum: 1, maximum: 20 }
        damageRoll: { type: string, maxLength: 40 }
    ConditionRef:
      type: object
      description: A condition named in rules text, with its own text for tooltips.
      additionalProperties: false
      required: [slug, name, description]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 4000 }
    Spell:
      type: object
      description: A spell with its full rules text.
      additionalProperties: false
      required: [slug, name, level, school, ruleset, ritual, concentration, castingTime, rangeText, verbal, somatic, material, duration, description, classes, damageTypes, attackRoll, scaling, mentions]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        level: { type: integer, format: int32, minimum: 0, maximum: 9 }
        school: { $ref: "#/components/schemas/Slug" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        ritual: { type: boolean }
        concentration: { type: boolean }
        castingTime: { type: string, maxLength: 120 }
        rangeText: { type: string, maxLength: 120 }
        rangeFeet: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        verbal: { type: boolean }
        somatic: { type: boolean }
        material: { type: boolean }
        materialText: { type: string, maxLength: 500 }
        duration: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 20000 }
        higherLevel: { type: string, maxLength: 4000 }
        classes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Slug" }
        damageTypes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Slug" }
        saveAbility: { $ref: "#/components/schemas/Slug" }
        attackRoll: { type: boolean }
        damageRoll: { type: string, maxLength: 40 }
        scaling:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/SpellScaling" }
        mentions:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/ConditionRef" }
    EntryKind:
      type: string
      description: A kind of compendium entry other than a spell.
      enum: [class, species, background, feat, weapon, armor, item, magic-item, monster, condition]
    EntrySummary:
      type: object
      description: An entry as it appears in a list.
      additionalProperties: false
      required: [kind, slug, name, subtitle, ruleset]
      properties:
        kind: { $ref: "#/components/schemas/EntryKind" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 120 }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
    EntryPage:
      type: object
      description: One page of entries.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EntrySummary" }
        nextCursor:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_-]+$"
    EntryFact:
      type: object
      description: A labelled value in an entry's header.
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, maxLength: 60 }
        value: { type: string, maxLength: 500 }
    EntrySection:
      type: object
      description: A titled block of rules text.
      additionalProperties: false
      required: [title, text]
      properties:
        title: { type: string, maxLength: 200 }
        text: { type: string, maxLength: 20000 }
    Entry:
      type: object
      description: An entry rendered for reading.
      additionalProperties: false
      required: [kind, slug, name, subtitle, ruleset, facts, sections, mentions]
      properties:
        kind: { $ref: "#/components/schemas/EntryKind" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 120 }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        facts:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/EntryFact" }
        sections:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/EntrySection" }
        mentions:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/ConditionRef" }
    AutomationCount:
      type: object
      description: Entries of one kind by Automation Level.
      additionalProperties: false
      required: [kind, total, full, partial, manual]
      properties:
        kind: { type: string, enum: [spell, class, species, background, feat, weapon, armor, item, magic-item, monster, condition] }
        total: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        full: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        partial: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        manual: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
    Source:
      type: object
      description: A source document and its required attribution.
      additionalProperties: false
      required: [key, title, rulesetYear, license, attribution, url]
      properties:
        key: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 200 }
        rulesetYear: { type: integer, format: int32, minimum: 2000, maximum: 2100 }
        license: { type: string, maxLength: 40 }
        attribution: { type: string, maxLength: 2000 }
        url: { type: string, pattern: "^https://", maxLength: 500 }
    Me:
      type: object
      description: The authenticated account.
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          description: Stable account id from the platform's identity provider.
          minLength: 1
          maxLength: 128
          pattern: "^[^\\s]+$"
      examples:
        - subject: 5b1c6f2e-9c1d-4f0e-a2a7-2d8e4a9f1b3c
    Status:
      type: object
      description: Service status.
      additionalProperties: false
      required: [service, version, database, startedAt]
      properties:
        service:
          type: string
          const: grimoire
        version:
          type: string
          maxLength: 64
          pattern: "^[0-9A-Za-z.+-]+$"
        database:
          type: string
          enum: [up]
        startedAt:
          type: string
          format: date-time
          maxLength: 40
      examples:
        - service: grimoire
          version: 0.1.0
          database: up
          startedAt: "2026-09-29T20:00:00Z"
    HealthStatus:
      type: object
      description: Probe result.
      additionalProperties: false
      examples:
        - status: ok
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 500
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
          maxLength: 500
