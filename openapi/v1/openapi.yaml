        endpoint: { type: string, format: uri, minLength: 1, maxLength: 2000 }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 1, maxLength: 200 }
            auth: { type: string, minLength: 1, maxLength: 100 }
