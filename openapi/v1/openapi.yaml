        id: { $ref: "#/components/schemas/Id" }
        author: { $ref: "#/components/schemas/Person" }
        body: { type: string, minLength: 1, maxLength: 4000 }
        at: { type: string, format: date-time, maxLength: 40 }
        mentions:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/MentionView" }
    MessagePage:
      type: object
      description: A page of messages, newest first.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/MessageEntry" }
    MessageSend:
      type: object
      description: A new message and what it mentions.
