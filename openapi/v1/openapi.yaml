        monsterSlug: { $ref: "#/components/schemas/Slug" }
        count: { type: integer, format: int32, minimum: 1, maximum: 100 }
    EncounterEntry:
      type: object
      description: One weighted line of an Encounter Table. An encounter lists its monsters, a pool names poolId, nothing has neither.
      additionalProperties: false
      required: [weight, kind, label]
