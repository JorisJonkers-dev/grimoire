        view: { $ref: "#/components/schemas/LiveView" }
        steps:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/LiveView" }
        path: { $ref: "#/components/schemas/LivePath" }
        preview: { $ref: "#/components/schemas/LiveAttackPreview" }
    LivePath:
      type: object
      description: The route a walk would take, start first, and the movement it costs.
      additionalProperties: false
      required: [tokenId, hexes, costFt]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        hexes:
          type: array
          maxItems: 61
          items: { $ref: "#/components/schemas/HexCoord" }
        costFt: { type: integer, format: int32, minimum: 0, maximum: 1000 }
    AmbientLight:
      type: string
      description: The light that fills a Map everywhere.
      enum: [bright, dim, dark]
    LiveMap:
      type: object
      description: The active Map's picture and hex calibration.
      additionalProperties: false
      required: [id, name, imageUrl, width, height, hexSizePx, originX, originY, imageVersion]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        imageUrl: { $ref: "#/components/schemas/AssetUrl" }
        width: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        height: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        hexSizePx: { type: number, format: double, minimum: 8, maximum: 400 }
        originX: { type: number, format: double, minimum: -100000, maximum: 100000 }
        originY: { type: number, format: double, minimum: -100000, maximum: 100000 }
        imageVersion: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
    LiveLight:
      type: object
      description: A light on the Map, for the DM.
      additionalProperties: false
      required: [id, q, r, brightFt, dimFt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        brightFt: { type: integer, format: int32, minimum: 0, maximum: 600 }
        dimFt: { type: integer, format: int32, minimum: 0, maximum: 600 }
    LiveView:
      type: object
      description: What one audience may see now. With fog, a hex is visible now, remembered, or in neither list because the party never saw it; nothing in it is sent. Walls, lights and ambient go to the DM only.
      additionalProperties: false
      required: [tokens, fog, visible, remembered]
      properties:
        tokens:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/LiveToken" }
        map: { $ref: "#/components/schemas/LiveMap" }
        fog: { type: boolean }
        visible:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        remembered:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        combat: { $ref: "#/components/schemas/LiveCombat" }
        walls:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/HexCoord" }
        lights:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/LiveLight" }
        ambient: { $ref: "#/components/schemas/AmbientLight" }
    LocalMap:
      type: object
      description: An uploaded Map and its hex calibration.
      additionalProperties: false
      required: [id, name, width, height, hexSizePx, originX, originY, ambient, imageUrl]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        width: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        height: { type: integer, format: int32, minimum: 1, maximum: 36000000 }
        hexSizePx: { type: number, format: double, minimum: 8, maximum: 400 }
        originX: { type: number, format: double, minimum: -100000, maximum: 100000 }
        originY: { type: number, format: double, minimum: -100000, maximum: 100000 }
        ambient: { $ref: "#/components/schemas/AmbientLight" }
        imageUrl: { $ref: "#/components/schemas/AssetUrl" }
    MapEdit:
      type: object
      description: A Map's name, calibration and ambient light.
      additionalProperties: false
      required: [name, hexSizePx, originX, originY, ambient]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        hexSizePx: { type: number, format: double, minimum: 8, maximum: 400 }
        originX: { type: number, format: double, minimum: -100000, maximum: 100000 }
        originY: { type: number, format: double, minimum: -100000, maximum: 100000 }
        ambient: { $ref: "#/components/schemas/AmbientLight" }
    Slug:
      type: string
      description: Lower-case, hyphenated identifier.
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    Ruleset:
      type: string
      description: Rules document key.
      enum: [srd-2024, srd-2014]
    SpellSummary:
      type: object
      description: A spell as it appears in a list.
      additionalProperties: false
      required: [slug, name, level, school, ruleset, ritual, concentration]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        level: { type: integer, format: int32, minimum: 0, maximum: 9 }
        school: { $ref: "#/components/schemas/Slug" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        ritual: { type: boolean }
        concentration: { type: boolean }
    SpellPage:
      type: object
      description: One page of spells.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SpellSummary" }
        nextCursor:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_-]+$"
    SpellScaling:
      type: object
      description: Damage at a higher slot or character level.
      additionalProperties: false
      required: [kind, level, damageRoll]
      properties:
        kind: { type: string, enum: [slot, character] }
        level: { type: integer, format: int32, minimum: 1, maximum: 20 }
        damageRoll: { type: string, maxLength: 40 }
    ConditionRef:
      type: object
      description: A condition named in rules text, with its own text for tooltips.
      additionalProperties: false
      required: [slug, name, description]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 4000 }
    Spell:
      type: object
      description: A spell with its full rules text.
      additionalProperties: false
      required: [slug, name, level, school, ruleset, ritual, concentration, castingTime, rangeText, verbal, somatic, material, duration, description, classes, damageTypes, attackRoll, scaling, mentions]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        level: { type: integer, format: int32, minimum: 0, maximum: 9 }
        school: { $ref: "#/components/schemas/Slug" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        ritual: { type: boolean }
        concentration: { type: boolean }
        castingTime: { type: string, maxLength: 120 }
        rangeText: { type: string, maxLength: 120 }
        rangeFeet: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        verbal: { type: boolean }
        somatic: { type: boolean }
        material: { type: boolean }
        materialText: { type: string, maxLength: 500 }
        duration: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 20000 }
        higherLevel: { type: string, maxLength: 4000 }
        classes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Slug" }
        damageTypes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Slug" }
        saveAbility: { $ref: "#/components/schemas/Slug" }
        attackRoll: { type: boolean }
        damageRoll: { type: string, maxLength: 40 }
        scaling:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/SpellScaling" }
        mentions:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/ConditionRef" }
    EntryKind:
      type: string
      description: A kind of compendium entry other than a spell.
      enum: [class, species, background, feat, weapon, armor, item, magic-item, monster, condition]
    EntrySummary:
      type: object
      description: An entry as it appears in a list.
      additionalProperties: false
      required: [kind, slug, name, subtitle, ruleset]
      properties:
        kind: { $ref: "#/components/schemas/EntryKind" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 120 }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
    EntryPage:
      type: object
      description: One page of entries.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EntrySummary" }
        nextCursor:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_-]+$"
    EntryFact:
      type: object
      description: A labelled value in an entry's header.
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, maxLength: 60 }
        value: { type: string, maxLength: 500 }
    EntrySection:
      type: object
      description: A titled block of rules text.
      additionalProperties: false
      required: [title, text]
      properties:
        title: { type: string, maxLength: 200 }
        text: { type: string, maxLength: 20000 }
    Entry:
      type: object
      description: An entry rendered for reading.
      additionalProperties: false
      required: [kind, slug, name, subtitle, ruleset, facts, sections, mentions]
      properties:
        kind: { $ref: "#/components/schemas/EntryKind" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 120 }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        facts:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/EntryFact" }
        sections:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/EntrySection" }
        mentions:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/ConditionRef" }
    AutomationCount:
      type: object
      description: Entries of one kind by Automation Level.
      additionalProperties: false
      required: [kind, total, full, partial, manual]
      properties:
        kind: { type: string, enum: [spell, class, species, background, feat, weapon, armor, item, magic-item, monster, condition] }
        total: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        full: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        partial: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        manual: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
    Source:
      type: object
      description: A source document and its required attribution.
      additionalProperties: false
      required: [key, title, rulesetYear, license, attribution, url]
      properties:
        key: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 200 }
        rulesetYear: { type: integer, format: int32, minimum: 2000, maximum: 2100 }
        license: { type: string, maxLength: 40 }
        attribution: { type: string, maxLength: 2000 }
        url: { type: string, pattern: "^https://", maxLength: 500 }
    Me:
      type: object
      description: The authenticated account.
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          description: Stable account id from the platform's identity provider.
          minLength: 1
          maxLength: 128
          pattern: "^[^\\s]+$"
      examples:
        - subject: 5b1c6f2e-9c1d-4f0e-a2a7-2d8e4a9f1b3c
    Status:
      type: object
      description: Service status.
      additionalProperties: false
      required: [service, version, database, startedAt]
      properties:
        service:
          type: string
          const: grimoire
        version:
          type: string
          maxLength: 64
          pattern: "^[0-9A-Za-z.+-]+$"
        database:
          type: string
          enum: [up]
        startedAt:
          type: string
          format: date-time
          maxLength: 40
      examples:
        - service: grimoire
          version: 0.1.0
          database: up
          startedAt: "2026-09-29T20:00:00Z"
    HealthStatus:
      type: object
      description: Probe result.
      additionalProperties: false
      examples:
        - status: ok
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          maxLength: 500
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
          maxLength: 500
