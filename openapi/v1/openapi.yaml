      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$", minLength: 20, maxLength: 64 }
        username: { type: string, minLength: 3, maxLength: 32 }
        nickname: { type: string, minLength: 1, maxLength: 40 }
