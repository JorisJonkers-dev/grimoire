  /api/v1/campaigns/{campaignId}/sessions/{sessionId}/commands:
    post:
      operationId: sendLiveCommand
      x-mcp:
        defaults: { nonce: mcp, q: 0, r: 0, hidden: false }
        tools:
          - tool: spawn_encounter
            kind: spawn_encounter
            fields: [monsters, q, r, hidden]
            required: [monsters]
            description: Places an encounter's monsters as enemy tokens on the free hexes nearest q, r, numbered when there are several. Undo it with undo_action to remove them all.
          - tool: place_token
            kind: place_token
            fields: [label, tokenKind, monsterSlug, characterId, controllerId, q, r, hidden, darkvisionFt]
            required: [tokenKind]
            description: Places one token. A monsterSlug or characterId gives it that creature's stats and name.
          - tool: move_token
            kind: move_token
            fields: [tokenId, q, r]
            required: [tokenId, q, r]
            description: Moves a token straight to a hex, without spending movement.
          - tool: reveal_area
            kind: reveal_hexes
            fields: [hexes, "on"]
            required: [hexes]
            defaults: { "on": true }
            description: Reveals hexes of the map to the party, or conceals them again with on set to false.
          - tool: apply_effect
            kind: apply_effect
            fields: [targetId, effect, effectName, sourceId, rounds, saveAbility, saveDc]
            required: [targetId, effect]
            description: Puts an Effect, such as a condition or a spell, on a token.
          - tool: end_effect
            kind: end_effect
            fields: [effectId]
            required: [effectId]
            description: Ends an Effect.
          - tool: adjust_hp
            kind: adjust_hp
            fields: [tokenId, hpDelta]
            required: [tokenId, hpDelta]
            description: Adds hit points to a creature, or takes them away with a negative hpDelta, within 0 and its maximum.
          - tool: run_encounter_check
            kind: encounter_check
            fields: [tableId, mode, entry]
            required: [tableId]
            defaults: { mode: normal }
            description: Runs an Encounter Check on an encounter table now; mode force guarantees an encounter and pick takes the entry you name.
          - tool: schedule_encounter_check
            kind: schedule_check
            fields: [tableId, due]
            required: [tableId, due]
            description: Schedules an Encounter Check for the next rest or the next Travel Leg.
          - tool: undo_action
            kind: undo
            fields: [seq]
            required: [seq]
            description: Undoes one Action of the Session by its Action Log sequence, as every live tool returns it.
      summary: Act in a live session
      description: Sends one command to a live Session as the caller, with the same authority as their live connection, and answers once the Session has applied it. Members only.
      tags: [Play]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveCommand"
      responses:
        "200":
          description: How the Session answered.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveCommandResult"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
