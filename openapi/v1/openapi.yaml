      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        toHit: { type: integer, format: int32, minimum: -10, maximum: 30 }
        reachFt: { type: integer, format: int32, minimum: 0, maximum: 60 }
        rangeFt: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        longRangeFt: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        damage: { type: string, maxLength: 40 }
        damageBonus: { type: integer, format: int32, minimum: -10, maximum: 50 }
        damageType: { type: string, maxLength: 80 }
    LiveAttackPreview:
      type: object
      description: What an attack would do, sent only to whoever asked. The hit chance is a percentage; reasons name every source behind it.
      additionalProperties: false
      required: [tokenId, targetId, attackNo, name, hitChance, mode, damageMin, damageMax, critMax, reasons]
      properties:
        tokenId: { $ref: "#/components/schemas/Id" }
        targetId: { $ref: "#/components/schemas/Id" }
        attackNo: { type: integer, format: int32, minimum: 0, maximum: 50 }
        name: { type: string, maxLength: 80 }
        hitChance: { type: integer, format: int32, minimum: 0, maximum: 100 }
        mode: { type: string, enum: [normal, advantage, disadvantage] }
        damageMin: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        damageMax: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        critMax: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        reasons:
