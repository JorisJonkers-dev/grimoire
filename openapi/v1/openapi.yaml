      type: object
      description: A name, the scopes and how many days a new Access Token lives.
      additionalProperties: false
      required: [name, scopes, days]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        scopes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccessTokenScope" }
        days: { type: integer, format: int32, minimum: 1, maximum: 365 }
    AccessTokenCreated:
      type: object
      description: A new Access Token; token is shown only now.
      additionalProperties: false
      required: [token, accessToken]
      properties:
        token: { type: string, pattern: "^gmt_[A-Za-z0-9_-]{43}$", minLength: 47, maxLength: 47 }
        accessToken: { $ref: "#/components/schemas/AccessToken" }
    TwoStepChallenge:
      type: object
      description: A sign-in waiting for its second step.
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: { type: string, minLength: 20, maxLength: 64 }
    TwoStepAnswer:
      type: object
      description: A challenge and the code that answers it, from the authenticator app or a recovery code.
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge: { type: string, pattern: "^[A-Za-z0-9_-]{20,64}$", minLength: 20, maxLength: 64 }
        code: { type: string, pattern: "^[0-9A-Za-z -]{6,16}$", minLength: 6, maxLength: 16 }
    TwoStepCode:
      type: object
      description: A code from the authenticator app or a recovery code.
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9A-Za-z -]{6,16}$", minLength: 6, maxLength: 16 }
    TwoStepSetup:
      type: object
      description: A new authenticator secret and the otpauth URI that adds it to an app.
      additionalProperties: false
      required: [secret, uri]
      properties:
        secret: { type: string, pattern: "^[A-Z2-7]{32}$", minLength: 32, maxLength: 32 }
        uri: { type: string, minLength: 1, maxLength: 500 }
    RecoveryCodes:
      type: object
      description: Recovery codes, each good once; shown only when made.
      additionalProperties: false
      required: [codes]
      properties:
        codes:
          type: array
          maxItems: 10
          items: { type: string, pattern: "^[a-z1-9]{5}-[a-z1-9]{5}$", minLength: 11, maxLength: 11 }
