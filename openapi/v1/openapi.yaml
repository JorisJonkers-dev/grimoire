      additionalProperties: false
      required: [id, version, title, body, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$", maxLength: 20 }
