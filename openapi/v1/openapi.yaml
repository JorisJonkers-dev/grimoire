              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
  /api/v1/campaigns/{campaignId}/character-draft:
    get:
      operationId: getCharacterDraft
      x-ogen-operation-group: Read
      summary: Read my Character draft
      description: "The Character the caller is making in this Campaign's wizard, with the step reached, the choices so far and any rolled scores."
      tags: [Campaign]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: The draft.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDraft"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
    put:
      operationId: saveCharacterDraft
      x-ogen-operation-group: Build
      summary: Save my Character draft
      description: Keeps the wizard's choices so the caller can come back to them; rolled scores stay as the server rolled them.
      tags: [Campaign]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterDraftSave"
      responses:
        "200":
          description: The draft.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDraft"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: discardCharacterDraft
      x-ogen-operation-group: Build
      summary: Discard my Character draft
      description: Starts the wizard over.
      tags: [Campaign]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "204":
          description: Discarded.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
  /api/v1/campaigns/{campaignId}/character-draft/roll:
    post:
      operationId: rollCharacterScores
      x-ogen-operation-group: Build
      summary: Roll ability scores
      description: Rolls six scores of 4d6 dropping the lowest, once per draft, when the Campaign allows rolling.
      tags: [Campaign]
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: The draft with its rolled scores.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDraft"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
  /healthz:
    get:
      operationId: getHealth
      x-ogen-operation-group: Read
      summary: Liveness probe
      description: Returns ok while the process is serving requests.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "4XX":
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadiness
      x-ogen-operation-group: Read
      summary: Readiness probe
      description: Returns ok once the API can serve traffic.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: The API is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "4XX":
          $ref: "#/components/responses/Problem"
        "5XX":
          $ref: "#/components/responses/Problem"
webhooks:
  liveCommand:
    post:
      operationId: liveCommand
      summary: Live command frame
      description: Not an HTTP call. The shape of every WebSocket frame a client sends on /api/v1/campaigns/{campaignId}/sessions/{sessionId}/live.
      tags: [Play]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveCommand"
      responses:
        "204":
          description: Frames are not answered individually.
  liveUpdate:
    post:
      operationId: liveUpdate
      summary: Live update frame
      description: Not an HTTP call. The shape of every WebSocket frame the server sends on the live Session socket.
      tags: [Play]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveUpdate"
      responses:
        "204":
          description: Frames are not answered individually.
components:
  securitySchemes:
    forwardAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: Identity injected by the platform's forward-auth; never sent by clients directly.
  parameters:
    RetrainId:
      name: retrainId
      in: path
      required: true
      description: Retrain id.
      schema: { $ref: "#/components/schemas/Id" }
    CampaignId:
      name: campaignId
      in: path
      required: true
      description: Campaign id.
      schema: { $ref: "#/components/schemas/Id" }
    MemberId:
      name: memberId
      in: path
      required: true
      description: Member id.
      schema: { $ref: "#/components/schemas/Id" }
    CharacterId:
      name: characterId
      in: path
      required: true
      description: Character id.
      schema: { $ref: "#/components/schemas/Id" }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session id.
      schema: { $ref: "#/components/schemas/Id" }
    RollId:
      name: rollId
      in: path
      required: true
      description: Roll Request id.
      schema: { $ref: "#/components/schemas/Id" }
    MapId:
      name: mapId
      in: path
      required: true
      description: Map id.
      schema: { $ref: "#/components/schemas/Id" }
    LootTableId:
      name: lootTableId
      in: path
      required: true
      description: Loot Table id.
      schema: { $ref: "#/components/schemas/Id" }
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: Settlement id.
      schema: { $ref: "#/components/schemas/Id" }
    ShopId:
      name: shopId
      in: path
      required: true
      description: Shop id.
      schema: { $ref: "#/components/schemas/Id" }
    PoolId:
      name: poolId
      in: path
      required: true
      description: Encounter Pool id.
      schema: { $ref: "#/components/schemas/Id" }
    TableId:
      name: tableId
      in: path
      required: true
      description: Encounter Table id.
      schema: { $ref: "#/components/schemas/Id" }
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Collection id.
      schema: { $ref: "#/components/schemas/Id" }
    ProposalId:
      name: proposalId
      in: path
      required: true
      description: Proposal id.
      schema: { $ref: "#/components/schemas/Id" }
    LibraryEntryId:
      name: entryId
      in: path
      required: true
      description: Library entry id.
      schema: { $ref: "#/components/schemas/Id" }
    NpcId:
      name: npcId
      in: path
      required: true
      description: NPC id.
      schema: { $ref: "#/components/schemas/Id" }
    RevisionNo:
      name: revisionNo
      in: path
      required: true
      description: Revision number.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100000 }
    InviteId:
      name: inviteId
      in: path
      required: true
      description: Invite id.
      schema: { $ref: "#/components/schemas/Id" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from an earlier response; the server answers 304 when nothing changed.
      schema: { type: string, maxLength: 100 }
    Ruleset:
      name: ruleset
      in: query
      description: Restrict to one ruleset; omitted, the 2024 rules lead.
      schema: { $ref: "#/components/schemas/Ruleset" }
  headers:
    SessionCookie:
      description: The session cookie, HttpOnly and Secure; cleared on sign-out.
      schema: { type: string, maxLength: 300 }
    OidcCookie:
      description: Binds an external sign-in to the browser that started it, for ten minutes.
      schema: { type: string, maxLength: 300 }
    ETag:
      description: Version of the compendium this response came from.
      schema: { type: string, maxLength: 100 }
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000000
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000000
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
  responses:
    Problem:
      description: An RFC 9457 problem.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      format: uuid
      description: Random identifier.
      maxLength: 36
    Role:
      type: string
      description: What a Member may do in a Campaign.
      enum: [dm, player]
    DisplayName:
      type: string
      description: How a Member appears to the rest of the table.
      minLength: 1
      maxLength: 60
    CampaignName:
      type: string
      description: A Campaign's name.
      minLength: 1
      maxLength: 80
    CampaignSummary:
      type: object
      description: A Campaign as it appears in the caller's list.
      additionalProperties: false
      required: [id, name, ruleset, myRole, memberCount, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        myRole: { $ref: "#/components/schemas/Role" }
        memberCount: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        reactionTimeoutS: { $ref: "#/components/schemas/ReactionTimeout" }
        highGround: { type: boolean, description: "Optional rule: attacks from higher ground get +2 to hit." }
        restSupplies: { type: boolean, description: "Optional rule: a Long Rest costs each resting Character a day of Rations." }
        initiativeMode: { $ref: "#/components/schemas/InitiativeMode" }
        creationMethods:
          type: array
          description: The ability score methods new Characters may use.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/CreationMethod" }
        startingLevel: { type: integer, format: int32, minimum: 1, maximum: 20, description: "The level new Characters start at." }
        holdLevelUps: { type: boolean, description: "Long rests stop unlocking the next level; the DM grants levels instead." }
        shareInitiative: { type: boolean, description: "Identical monsters share one initiative roll." }
    CampaignPage:
      type: object
      description: One page of campaigns.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CampaignSummary" }
        nextCursor:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_-]+$"
    Member:
      type: object
      description: An account's participation in a Campaign.
      additionalProperties: false
      required: [id, displayName, role, joinedAt, isMe]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        displayName: { $ref: "#/components/schemas/DisplayName" }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time, maxLength: 40 }
        isMe: { type: boolean }
    Campaign:
      type: object
      description: A Campaign's home.
      additionalProperties: false
      required: [id, name, ruleset, myRole, memberCount, createdAt, me, members]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        myRole: { $ref: "#/components/schemas/Role" }
        memberCount: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        reactionTimeoutS: { $ref: "#/components/schemas/ReactionTimeout" }
        highGround: { type: boolean, description: "Optional rule: attacks from higher ground get +2 to hit." }
        restSupplies: { type: boolean, description: "Optional rule: a Long Rest costs each resting Character a day of Rations." }
        initiativeMode: { $ref: "#/components/schemas/InitiativeMode" }
        creationMethods:
          type: array
          description: The ability score methods new Characters may use.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/CreationMethod" }
        startingLevel: { type: integer, format: int32, minimum: 1, maximum: 20, description: "The level new Characters start at." }
        holdLevelUps: { type: boolean, description: "Long rests stop unlocking the next level; the DM grants levels instead." }
        shareInitiative: { type: boolean, description: "Identical monsters share one initiative roll." }
        me: { $ref: "#/components/schemas/Member" }
        members:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Member" }
    CampaignCreate:
      type: object
      description: A new Campaign.
      additionalProperties: false
      required: [name, displayName]
      properties:
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/CampaignRuleset" }
        displayName: { $ref: "#/components/schemas/DisplayName" }
    CampaignUpdate:
      type: object
      description: Settings to change; omitted fields stay as they are.
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/CampaignRuleset" }
        reactionTimeoutS: { $ref: "#/components/schemas/ReactionTimeout" }
        highGround: { type: boolean, description: "Optional rule: attacks from higher ground get +2 to hit." }
        restSupplies: { type: boolean, description: "Optional rule: a Long Rest costs each resting Character a day of Rations." }
        initiativeMode: { $ref: "#/components/schemas/InitiativeMode" }
        creationMethods:
          type: array
          description: The ability score methods new Characters may use.
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/CreationMethod" }
        startingLevel: { type: integer, format: int32, minimum: 1, maximum: 20, description: "The level new Characters start at." }
        holdLevelUps: { type: boolean, description: "Long rests stop unlocking the next level; the DM grants levels instead." }
        shareInitiative: { type: boolean, description: "Identical monsters share one initiative roll." }
    Account:
      type: object
      description: A Grimoire Account.
      additionalProperties: false
      required: [id, username, nickname, email, admin, hasPassword, twoStep, recoveryCodesLeft, adminPowers]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { $ref: "#/components/schemas/Username" }
        nickname: { type: string, minLength: 1, maxLength: 40 }
        email: { type: string, format: email, maxLength: 254 }
        admin: { type: boolean }
        hasPassword: { type: boolean, description: "Whether the Account can sign in with a password." }
        twoStep: { type: boolean, description: "Whether two-step sign-in is on." }
        recoveryCodesLeft: { type: integer, format: int32, minimum: 0, maximum: 10 }
        adminPowers: { type: boolean, description: "Whether this request holds Admin powers; an Admin needs two-step or the external login." }
        oidc: { $ref: "#/components/schemas/OidcLink" }
    Toggle:
      type: object
      description: Turns a setting on or off.
      additionalProperties: false
      required: [value]
      properties:
        value: { type: boolean }
    AccountEvent:
      type: object
      description: One thing that happened to an Account, and who did it.
      additionalProperties: false
      required: [at, actor, action, detail]
      properties:
        at: { type: string, format: date-time, maxLength: 40 }
        actor: { type: string, maxLength: 200, description: "The Username of whoever did it, or their subject when they have no Account." }
        action:
          type: string
          enum: [created, password_set, two_step_on, two_step_off, two_step_reset, linked, unlinked, sign_in_link_sent, admin_granted, admin_revoked, disabled, enabled, new_sign_in]
        detail: { type: string, maxLength: 200 }
    AccountEventList:
      type: object
      description: An Account's history, newest first.
