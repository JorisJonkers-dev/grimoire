      additionalProperties: false
      required: [publicKey]
      properties:
        publicKey: { type: string, minLength: 1, maxLength: 200 }
    PushSubscriptionInput:
      type: object
      description: A browser's push subscription, as PushSubscription.toJSON gives it.
