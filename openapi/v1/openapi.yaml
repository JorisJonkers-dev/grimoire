        kind: { $ref: "#/components/schemas/MentionKind" }
        campaignId: { $ref: "#/components/schemas/Id" }
        id: { $ref: "#/components/schemas/Id" }
    MentionView:
      type: object
      description: A Mention as the reader sees it; label and mapId appear only when they may open it.
