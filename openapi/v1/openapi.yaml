webhooks:
  liveCommand:
    post:
      operationId: liveCommand
      summary: Live command frame
      description: Not an HTTP call. The shape of every WebSocket frame a client sends on /api/v1/campaigns/{campaignId}/sessions/{sessionId}/live.
      tags: [Play]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveCommand"
      responses:
        "204":
          description: Frames are not answered individually.
  liveUpdate:
    post:
      operationId: liveUpdate
      summary: Live update frame
      description: Not an HTTP call. The shape of every WebSocket frame the server sends on the live Session socket.
      tags: [Play]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveUpdate"
      responses:
        "204":
          description: Frames are not answered individually.
components:
  securitySchemes:
    forwardAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: Identity injected by the platform's forward-auth; never sent by clients directly.
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      description: Campaign id.
      schema: { $ref: "#/components/schemas/Id" }
    MemberId:
      name: memberId
      in: path
      required: true
      description: Member id.
      schema: { $ref: "#/components/schemas/Id" }
    CharacterId:
      name: characterId
      in: path
      required: true
      description: Character id.
      schema: { $ref: "#/components/schemas/Id" }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session id.
      schema: { $ref: "#/components/schemas/Id" }
    RollId:
      name: rollId
      in: path
      required: true
      description: Roll Request id.
      schema: { $ref: "#/components/schemas/Id" }
    MapId:
      name: mapId
      in: path
      required: true
      description: Map id.
      schema: { $ref: "#/components/schemas/Id" }
    LootTableId:
      name: lootTableId
      in: path
      required: true
      description: Loot Table id.
      schema: { $ref: "#/components/schemas/Id" }
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: Settlement id.
      schema: { $ref: "#/components/schemas/Id" }
    ShopId:
      name: shopId
      in: path
      required: true
      description: Shop id.
      schema: { $ref: "#/components/schemas/Id" }
    PoolId:
      name: poolId
      in: path
      required: true
      description: Encounter Pool id.
      schema: { $ref: "#/components/schemas/Id" }
    TableId:
      name: tableId
      in: path
      required: true
      description: Encounter Table id.
      schema: { $ref: "#/components/schemas/Id" }
    NpcId:
      name: npcId
      in: path
      required: true
      description: NPC id.
      schema: { $ref: "#/components/schemas/Id" }
    RevisionNo:
      name: revisionNo
      in: path
      required: true
      description: Revision number.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100000 }
    InviteId:
      name: inviteId
      in: path
      required: true
      description: Invite id.
      schema: { $ref: "#/components/schemas/Id" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from an earlier response; the server answers 304 when nothing changed.
      schema: { type: string, maxLength: 100 }
    Ruleset:
      name: ruleset
      in: query
      description: Restrict to one ruleset; omitted, the 2024 rules lead.
      schema: { $ref: "#/components/schemas/Ruleset" }
  headers:
    ETag:
      description: Version of the compendium this response came from.
      schema: { type: string, maxLength: 100 }
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000000
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000000
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
  responses:
    Problem:
      description: An RFC 9457 problem.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      format: uuid
      description: Random identifier.
      maxLength: 36
    Role:
      type: string
      description: What a Member may do in a Campaign.
      enum: [dm, player]
    DisplayName:
      type: string
      description: How a Member appears to the rest of the table.
      minLength: 1
      maxLength: 60
    CampaignName:
      type: string
      description: A Campaign's name.
      minLength: 1
      maxLength: 80
    CampaignSummary:
      type: object
      description: A Campaign as it appears in the caller's list.
      additionalProperties: false
      required: [id, name, ruleset, myRole, memberCount, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        myRole: { $ref: "#/components/schemas/Role" }
        memberCount: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        reactionTimeoutS: { $ref: "#/components/schemas/ReactionTimeout" }
        highGround: { type: boolean, description: "Optional rule: attacks from higher ground get +2 to hit." }
    CampaignPage:
      type: object
      description: One page of campaigns.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CampaignSummary" }
        nextCursor:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9_-]+$"
    Member:
      type: object
      description: An account's participation in a Campaign.
      additionalProperties: false
      required: [id, displayName, role, joinedAt, isMe]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        displayName: { $ref: "#/components/schemas/DisplayName" }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time, maxLength: 40 }
        isMe: { type: boolean }
    Campaign:
      type: object
      description: A Campaign's home.
      additionalProperties: false
      required: [id, name, ruleset, myRole, memberCount, createdAt, me, members]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        myRole: { $ref: "#/components/schemas/Role" }
        memberCount: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        reactionTimeoutS: { $ref: "#/components/schemas/ReactionTimeout" }
        highGround: { type: boolean, description: "Optional rule: attacks from higher ground get +2 to hit." }
        me: { $ref: "#/components/schemas/Member" }
        members:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/Member" }
    CampaignCreate:
      type: object
      description: A new Campaign.
      additionalProperties: false
      required: [name, displayName]
      properties:
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        displayName: { $ref: "#/components/schemas/DisplayName" }
    CampaignUpdate:
      type: object
      description: Settings to change; omitted fields stay as they are.
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/CampaignName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        reactionTimeoutS: { $ref: "#/components/schemas/ReactionTimeout" }
        highGround: { type: boolean, description: "Optional rule: attacks from higher ground get +2 to hit." }
    ReactionTimeout:
      type: integer
      format: int32
      description: Seconds a Reaction Prompt waits before it counts as declined.
      minimum: 3
      maximum: 120
    CampaignRef:
      type: object
      description: A reference to a Campaign.
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/Id" }
    MemberUpdate:
      type: object
      description: A Member's new role.
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    Invite:
      type: object
      description: An open invite link.
      additionalProperties: false
      required: [id, createdAt, expiresAt, createdBy]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        expiresAt: { type: string, format: date-time, maxLength: 40 }
        createdBy: { $ref: "#/components/schemas/DisplayName" }
    NewInvite:
      type: object
      description: A new invite and the token for its link, shown once.
      additionalProperties: false
      required: [id, createdAt, expiresAt, createdBy, token]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        expiresAt: { type: string, format: date-time, maxLength: 40 }
        createdBy: { $ref: "#/components/schemas/DisplayName" }
        token: { $ref: "#/components/schemas/Token" }
    InvitePreview:
      type: object
      description: Where an invite link leads.
      additionalProperties: false
      required: [campaignName, invitedBy]
      properties:
        campaignName: { $ref: "#/components/schemas/CampaignName" }
        invitedBy: { $ref: "#/components/schemas/DisplayName" }
    Token:
      type: string
      description: An invite token, as it appears in the invite link.
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]+$"
    InviteToken:
      type: object
      description: An invite token.
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/Token" }
    InviteAccept:
      type: object
      description: The invite token and how the new Member wants to appear.
      additionalProperties: false
      required: [token, displayName]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        displayName: { $ref: "#/components/schemas/DisplayName" }
    Ability:
      type: string
      description: One of the six abilities.
      enum: [strength, dexterity, constitution, intelligence, wisdom, charisma]
    AbilityBase:
      type: object
      description: Base ability scores before origin increases.
      additionalProperties: false
      required: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      properties:
        strength: { type: integer, format: int32, minimum: 3, maximum: 18 }
        dexterity: { type: integer, format: int32, minimum: 3, maximum: 18 }
        constitution: { type: integer, format: int32, minimum: 3, maximum: 18 }
        intelligence: { type: integer, format: int32, minimum: 3, maximum: 18 }
        wisdom: { type: integer, format: int32, minimum: 3, maximum: 18 }
        charisma: { type: integer, format: int32, minimum: 3, maximum: 18 }
    AbilityBonus:
      type: object
      description: Origin ability increases, +2 and +1 or +1 to three abilities.
      additionalProperties: false
      properties:
        strength: { type: integer, format: int32, minimum: 1, maximum: 2 }
        dexterity: { type: integer, format: int32, minimum: 1, maximum: 2 }
        constitution: { type: integer, format: int32, minimum: 1, maximum: 2 }
        intelligence: { type: integer, format: int32, minimum: 1, maximum: 2 }
        wisdom: { type: integer, format: int32, minimum: 1, maximum: 2 }
        charisma: { type: integer, format: int32, minimum: 1, maximum: 2 }
    CharacterName:
      type: string
      description: A Character's name.
      minLength: 1
      maxLength: 60
    ArmorChoice:
      type: string
      description: Body armour slug, or empty for none.
      maxLength: 80
      pattern: "^([a-z0-9]+(-[a-z0-9]+)*)?$"
    CharacterBuild:
      type: object
      description: The choices for a first-level Character.
      additionalProperties: false
      required: [name, species, class, background, method, base, bonus, skills, shield, weapons]
      properties:
        name: { $ref: "#/components/schemas/CharacterName" }
        species: { $ref: "#/components/schemas/Slug" }
        class: { $ref: "#/components/schemas/Slug" }
        background: { $ref: "#/components/schemas/Slug" }
        method: { type: string, enum: [standard-array, point-buy, rolled] }
        base: { $ref: "#/components/schemas/AbilityBase" }
        bonus: { $ref: "#/components/schemas/AbilityBonus" }
        skills:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Slug" }
        armor: { $ref: "#/components/schemas/ArmorChoice" }
        shield: { type: boolean }
        weapons:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Slug" }
    CharacterEdit:
      type: object
      description: Out-of-combat changes; omitted fields stay as they are.
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/CharacterName" }
        hpCurrent: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        armor: { $ref: "#/components/schemas/ArmorChoice" }
        shield: { type: boolean }
        weapons:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Slug" }
    NamedRef:
      type: object
      description: A compendium entry by slug and name.
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
    AbilityLine:
      type: object
      description: One ability on the sheet with its saving throw.
      additionalProperties: false
      required: [ability, score, modifier, save, saveProficient]
      properties:
        ability: { $ref: "#/components/schemas/Ability" }
        score: { type: integer, format: int32, minimum: 1, maximum: 30 }
        modifier: { type: integer, format: int32, minimum: -5, maximum: 10 }
        save: { type: integer, format: int32, minimum: -5, maximum: 30 }
        saveProficient: { type: boolean }
    SkillLine:
      type: object
      description: One skill on the sheet.
      additionalProperties: false
      required: [skill, ability, bonus, proficient]
      properties:
        skill: { $ref: "#/components/schemas/Slug" }
        ability: { $ref: "#/components/schemas/Ability" }
        bonus: { type: integer, format: int32, minimum: -5, maximum: 30 }
        proficient: { type: boolean }
    ResourcePool:
      type: object
      description: A spendable pool such as hit dice or spell slots.
      additionalProperties: false
      required: [key, label, current, max]
      properties:
        key: { $ref: "#/components/schemas/Slug" }
        label: { type: string, maxLength: 80 }
        current: { type: integer, format: int32, minimum: 0, maximum: 100 }
        max: { type: integer, format: int32, minimum: 0, maximum: 100 }
    WeaponLine:
      type: object
      description: A carried weapon.
      additionalProperties: false
      required: [slug, name, damageDice, damageType, rangeFeet, longRangeFeet]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        damageDice: { type: string, maxLength: 20 }
        damageType: { type: string, maxLength: 40 }
        rangeFeet: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        longRangeFeet: { type: integer, format: int32, minimum: 0, maximum: 10000 }
    ActiveEffect:
      type: object
      description: An Effect currently on the Character.
      additionalProperties: false
      required: [name, detail]
      properties:
        name: { type: string, maxLength: 120 }
        detail: { type: string, maxLength: 500 }
    CharacterSheet:
      type: object
      description: A Character's sheet with every value derived by the rules.
      additionalProperties: false
      required: [name, ruleset, level, ownerName, mine, editable, species, class, background, method, base, bonus, abilities, skills, classSkills, backgroundSkills, hpCurrent, hpMax, armorClass, initiative, speedFeet, proficiencyBonus, passivePerception, shield, weapons, resources, effects, warnings]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CharacterName" }
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        level: { type: integer, format: int32, minimum: 1, maximum: 20 }
        ownerName: { $ref: "#/components/schemas/DisplayName" }
        mine: { type: boolean }
        editable: { type: boolean }
        species: { $ref: "#/components/schemas/NamedRef" }
        class: { $ref: "#/components/schemas/NamedRef" }
        background: { $ref: "#/components/schemas/NamedRef" }
        method: { type: string, enum: [standard-array, point-buy, rolled] }
        base: { $ref: "#/components/schemas/AbilityBase" }
        bonus: { $ref: "#/components/schemas/AbilityBonus" }
        abilities:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/AbilityLine" }
        skills:
          type: array
          maxItems: 18
          items: { $ref: "#/components/schemas/SkillLine" }
        classSkills:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Slug" }
        backgroundSkills:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Slug" }
        hpCurrent: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        hpMax: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        armorClass: { type: integer, format: int32, minimum: 0, maximum: 50 }
        initiative: { type: integer, format: int32, minimum: -5, maximum: 30 }
        speedFeet: { type: integer, format: int32, minimum: 0, maximum: 200 }
        proficiencyBonus: { type: integer, format: int32, minimum: 2, maximum: 6 }
        passivePerception: { type: integer, format: int32, minimum: 0, maximum: 50 }
        armor: { $ref: "#/components/schemas/NamedRef" }
        shield: { type: boolean }
        weapons:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/WeaponLine" }
        resources:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ResourcePool" }
        effects:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ActiveEffect" }
        warnings:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 200 }
        portraitUrl: { $ref: "#/components/schemas/AssetUrl" }
        tokenUrl: { $ref: "#/components/schemas/AssetUrl" }
    AssetUrl:
      type: string
      description: Same-origin path of a stored picture; it changes when the picture does.
      maxLength: 300
      pattern: "^/api/v1/"
    CharacterSummary:
      type: object
      description: A Character in the party list.
      additionalProperties: false
      required: [id, name, ownerName, mine, species, class, level, hpCurrent, hpMax]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CharacterName" }
        ownerName: { $ref: "#/components/schemas/DisplayName" }
        mine: { type: boolean }
        species: { $ref: "#/components/schemas/Slug" }
        class: { $ref: "#/components/schemas/Slug" }
        level: { type: integer, format: int32, minimum: 1, maximum: 20 }
        hpCurrent: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        hpMax: { type: integer, format: int32, minimum: 1, maximum: 1000 }
        tokenUrl: { $ref: "#/components/schemas/AssetUrl" }
    ClassChoice:
      type: object
      description: A class and what it gives at level 1.
      additionalProperties: false
      required: [slug, name, hitDie, saves, skillChoices]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        hitDie: { type: integer, format: int32, minimum: 0, maximum: 12 }
        saves:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/Ability" }
        skillChoices: { type: integer, format: int32, minimum: 0, maximum: 6 }
    SpeciesChoice:
      type: object
      description: A playable species.
      additionalProperties: false
      required: [slug, name, speedFeet]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        speedFeet: { type: integer, format: int32, minimum: 0, maximum: 200 }
    BackgroundChoice:
      type: object
      description: A background and what it grants; empty abilities means a free choice.
      additionalProperties: false
      required: [slug, name, abilities, skills]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        abilities:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/Ability" }
        skills:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/Slug" }
    ArmorOptionItem:
      type: object
      description: A suit of armour or a shield.
      additionalProperties: false
      required: [slug, name, category, shield, acBase, addDex, strengthRequired, stealthDisadvantage]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, maxLength: 120 }
        category: { type: string, maxLength: 40 }
        shield: { type: boolean }
        acBase: { type: integer, format: int32, minimum: 0, maximum: 30 }
        addDex: { type: boolean }
        dexCap: { type: integer, format: int32, minimum: 0, maximum: 10 }
        strengthRequired: { type: integer, format: int32, minimum: 0, maximum: 30 }
        stealthDisadvantage: { type: boolean }
    SkillChoice:
      type: object
      description: A skill and its ability.
      additionalProperties: false
      required: [skill, ability]
      properties:
        skill: { $ref: "#/components/schemas/Slug" }
        ability: { $ref: "#/components/schemas/Ability" }
    BuilderOptions:
      type: object
      description: What a first-level character can choose in one ruleset.
      additionalProperties: false
      required: [ruleset, rulesetYear, pointBuyBudget, classes, species, backgrounds, armor, weapons, skills]
      properties:
        ruleset: { $ref: "#/components/schemas/Ruleset" }
        rulesetYear: { type: integer, format: int32, minimum: 2000, maximum: 2100 }
        pointBuyBudget: { type: integer, format: int32, minimum: 0, maximum: 100 }
        classes:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ClassChoice" }
        species:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SpeciesChoice" }
        backgrounds:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/BackgroundChoice" }
        armor:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ArmorOptionItem" }
        weapons:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WeaponLine" }
        skills:
          type: array
          maxItems: 18
          items: { $ref: "#/components/schemas/SkillChoice" }
    Disposition:
      type: string
      description: How an NPC feels about the party.
      enum: [friendly, neutral, hostile]
    NpcInput:
      type: object
      description: The editable fields of an NPC.
      additionalProperties: false
      required: [name, disposition]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 8000 }
        dmNotes: { type: string, maxLength: 8000 }
        disposition: { $ref: "#/components/schemas/Disposition" }
    Npc:
      type: object
      description: A non-player character in the DM's prep.
      additionalProperties: false
      required: [id, name, title, description, dmNotes, disposition, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 8000 }
        dmNotes: { type: string, maxLength: 8000 }
        disposition: { $ref: "#/components/schemas/Disposition" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    DeletedNpc:
      type: object
      description: An NPC that only its Revisions remember.
      additionalProperties: false
      required: [id, name, deletedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        deletedAt: { type: string, format: date-time, maxLength: 40 }
    EncounterDifficulty:
      type: string
      description: How hard a generated encounter aims to be, by the 2024 XP budget.
      enum: [low, moderate, high]
    EncounterPoolMember:
      type: object
      description: A creature a Pool can field, how often it is drawn, and how many an encounter holds at least and at most.
      additionalProperties: false
      required: [monsterSlug, weight, min, max]
      properties:
        monsterSlug: { $ref: "#/components/schemas/Slug" }
        weight: { type: integer, format: int32, minimum: 1, maximum: 100 }
        min: { type: integer, format: int32, minimum: 0, maximum: 20 }
        max: { type: integer, format: int32, minimum: 1, maximum: 20 }
    EncounterPoolInput:
      type: object
      description: An Encounter Pool as the DM writes it.
      additionalProperties: false
      required: [name, levelMin, levelMax, difficulty, members]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        levelMin: { type: integer, format: int32, minimum: 1, maximum: 20 }
        levelMax: { type: integer, format: int32, minimum: 1, maximum: 20 }
        difficulty: { $ref: "#/components/schemas/EncounterDifficulty" }
        members:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/EncounterPoolMember" }
    EncounterPool:
      type: object
      description: A weighted set of creatures for a band of party levels, filled to its difficulty's XP budget when drawn.
      additionalProperties: false
      required: [id, name, levelMin, levelMax, difficulty, members, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        levelMin: { type: integer, format: int32, minimum: 1, maximum: 20 }
        levelMax: { type: integer, format: int32, minimum: 1, maximum: 20 }
        difficulty: { $ref: "#/components/schemas/EncounterDifficulty" }
        members:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/EncounterPoolMember" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    EncounterMonster:
      type: object
      description: How many of one creature an encounter holds.
      additionalProperties: false
      required: [monsterSlug, count]
      properties:
        monsterSlug: { $ref: "#/components/schemas/Slug" }
        count: { type: integer, format: int32, minimum: 1, maximum: 100 }
    EncounterEntry:
      type: object
      description: One weighted line of an Encounter Table. An encounter lists its monsters, a pool names poolId, nothing has neither.
      additionalProperties: false
      required: [weight, kind, label]
      properties:
        weight: { type: integer, format: int32, minimum: 1, maximum: 100 }
        kind: { type: string, enum: [encounter, pool, nothing] }
        label: { type: string, maxLength: 80 }
        poolId: { $ref: "#/components/schemas/Id" }
        monsters:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/EncounterMonster" }
    EncounterVisibility:
      type: string
      description: Secret checks show only the outcome; open checks show their roll on the Table Display.
      enum: [secret, open]
    EncounterTableInput:
      type: object
      description: An Encounter Table as the DM writes it. Without a regionId it applies everywhere.
      additionalProperties: false
      required: [name, chancePct, visibility, entries]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        regionId: { $ref: "#/components/schemas/Id" }
        chancePct: { type: integer, format: int32, minimum: 0, maximum: 100 }
        visibility: { $ref: "#/components/schemas/EncounterVisibility" }
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/EncounterEntry" }
    EncounterTable:
      type: object
      description: A Region's chance of an encounter and its weighted entries.
      additionalProperties: false
      required: [id, name, chancePct, visibility, entries, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        regionId: { $ref: "#/components/schemas/Id" }
        chancePct: { type: integer, format: int32, minimum: 0, maximum: 100 }
        visibility: { $ref: "#/components/schemas/EncounterVisibility" }
        entries:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EncounterEntry" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    Location:
      type: object
      description: A place on one of the Campaign's world maps.
      additionalProperties: false
      required: [id, name, mapName]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 40 }
        mapName: { type: string, maxLength: 80 }
    EncounterCheck:
      type: object
      description: One Encounter Check, with the seed its draw used and what it produced.
      additionalProperties: false
      required: [id, tableName, trigger, mode, visibility, seed, chancePct, status, entryLabel, monsters, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        sessionId: { $ref: "#/components/schemas/Id" }
        tableName: { type: string, maxLength: 80 }
        trigger: { $ref: "#/components/schemas/EncounterTrigger" }
        mode: { $ref: "#/components/schemas/EncounterMode" }
        visibility: { $ref: "#/components/schemas/EncounterVisibility" }
        seed: { type: string, maxLength: 20, description: "The draw's seed, as a decimal string." }
        chancePct: { type: integer, format: int32, minimum: 0, maximum: 100 }
        chanceRoll: { type: integer, format: int32, minimum: 1, maximum: 100 }
        status: { type: string, enum: [pending, resolved] }
        outcome: { type: string, enum: [encounter, nothing] }
        entryLabel: { type: string, maxLength: 80 }
        monsters:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EncounterMonster" }
        createdAt: { type: string, format: date-time, maxLength: 40 }
    EncounterTrigger:
      type: string
      description: What set off an Encounter Check.
      enum: [short_rest, long_rest, travel_leg, dm]
    EncounterMode:
      type: string
      description: A normal check rolls the chance; force_encounter skips it and never draws Nothing; pick takes the entry the DM chose.
      enum: [normal, force_encounter, pick]
    LootEntry:
      type: object
      description: One weighted line of a Loot Table. An item names itemSlug and an amount, coins name coin and an amount, a table names tableId; amounts read like 3, 2d6, 1d4+1 or 4d6x10.
      additionalProperties: false
      required: [weight, kind]
      properties:
        weight: { type: integer, format: int32, minimum: 1, maximum: 100 }
        kind: { type: string, enum: [item, currency, table, nothing] }
        itemSlug: { $ref: "#/components/schemas/Slug" }
        coin: { $ref: "#/components/schemas/Coin" }
        amount: { type: string, maxLength: 20 }
        tableId: { $ref: "#/components/schemas/Id" }
    Coin:
      type: string
      description: A kind of coin.
      enum: [cp, sp, ep, gp, pp]
    LootTableInput:
      type: object
      description: A Loot Table as the DM writes it.
      additionalProperties: false
      required: [name, rolls, entries]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        rolls: { type: integer, format: int32, minimum: 1, maximum: 10 }
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/LootEntry" }
    LootTable:
      type: object
      description: A Loot Table, rolled a number of times over its weighted entries.
      additionalProperties: false
      required: [id, name, rolls, entries, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        rolls: { type: integer, format: int32, minimum: 1, maximum: 10 }
        entries:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LootEntry" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    SettlementInput:
      type: object
      description: A Settlement as the DM writes it; locationId places it on a world map.
      additionalProperties: false
      required: [name, size, wealth]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        size: { type: string, enum: [hamlet, village, town, city] }
        wealth: { type: string, enum: [poor, modest, comfortable, wealthy] }
        locationId: { $ref: "#/components/schemas/Id" }
    Settlement:
      type: object
      description: A named inhabited place with a size and a wealth tier.
      additionalProperties: false
      required: [id, name, size, wealth, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        size: { type: string, enum: [hamlet, village, town, city] }
        wealth: { type: string, enum: [poor, modest, comfortable, wealthy] }
        locationId: { $ref: "#/components/schemas/Id" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    ShopRestock:
      type: string
      description: When a Shop restocks from its Loot Table.
      enum: [never, long_rest, days]
    ShopInput:
      type: object
      description: A Shop as the DM writes it. restockDays is required when it restocks every few days.
      additionalProperties: false
      required: [settlementId, name, kind, markupPct, haggleDc, hagglePct, restock]
      properties:
        settlementId: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, minLength: 1, maxLength: 40 }
        ownerId: { $ref: "#/components/schemas/Id" }
        markupPct: { type: integer, format: int32, minimum: 0, maximum: 300 }
        haggleDc: { type: integer, format: int32, minimum: 5, maximum: 30 }
        hagglePct: { type: integer, format: int32, minimum: 0, maximum: 50 }
        lootTableId: { $ref: "#/components/schemas/Id" }
        restock: { $ref: "#/components/schemas/ShopRestock" }
        restockDays: { type: integer, format: int32, minimum: 1, maximum: 365 }
    StockItem:
      type: object
      description: How many of an item a Shop sells and its asking price in copper.
      additionalProperties: false
      required: [itemSlug, quantity, priceCp]
      properties:
        itemSlug: { $ref: "#/components/schemas/Slug" }
        quantity: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        priceCp: { type: integer, format: int32, minimum: 1, maximum: 2000000000 }
    Shop:
      type: object
      description: A trader in a Settlement with its Stock; stockedDay is the in-game day it last restocked.
      additionalProperties: false
      required: [id, settlementId, name, kind, markupPct, haggleDc, hagglePct, restock, stockedDay, stock, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        settlementId: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        kind: { type: string, maxLength: 40 }
        ownerId: { $ref: "#/components/schemas/Id" }
        markupPct: { type: integer, format: int32, minimum: 0, maximum: 300 }
        haggleDc: { type: integer, format: int32, minimum: 5, maximum: 30 }
        hagglePct: { type: integer, format: int32, minimum: 0, maximum: 50 }
        lootTableId: { $ref: "#/components/schemas/Id" }
        restock: { $ref: "#/components/schemas/ShopRestock" }
        restockDays: { type: integer, format: int32, minimum: 1, maximum: 365 }
        stockedDay: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        stock:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/StockItem" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    Revision:
      type: object
      description: One recorded version of a piece of prep data.
      additionalProperties: false
      required: [no, action, author, origin, createdAt]
      properties:
        no: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        action: { type: string, enum: [create, update, delete, restore] }
        author: { $ref: "#/components/schemas/DisplayName" }
        origin: { type: string, enum: [ui, mcp, generator, system] }
        client: { type: string, maxLength: 80 }
        restoredFrom: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
    Activity:
      type: object
      description: One prep change as a Revision, with what it changed and whether it is still the entity's latest.
      additionalProperties: false
      required: [revisionId, entityType, entityId, name, no, action, author, origin, createdAt, undoable]
      properties:
        revisionId: { $ref: "#/components/schemas/Id" }
        entityType: { type: string, enum: [npc, encounter_pool, encounter_table, encounter_check, loot_table, settlement, shop] }
        entityId: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 120 }
        no: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        action: { type: string, enum: [create, update, delete, restore] }
        author: { $ref: "#/components/schemas/DisplayName" }
        origin: { type: string, enum: [ui, mcp, generator, system] }
        client: { type: string, maxLength: 80 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        undoable: { type: boolean }
    FieldChange:
      type: object
      description: A field whose value differs between two Revisions.
      additionalProperties: false
      required: [field, before, after]
      properties:
        field: { type: string, maxLength: 60 }
        before: { type: string, maxLength: 8000 }
        after: { type: string, maxLength: 8000 }
    RollModifier:
      type: object
      description: A named flat bonus or penalty.
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        value: { type: integer, format: int32, minimum: -100, maximum: 100 }
    GroupLabel:
      type: object
      description: Why a group of dice is thrown, such as Bless.
      additionalProperties: false
      required: [group, label]
      properties:
        group: { type: integer, format: int32, minimum: 0, maximum: 5 }
        label: { type: string, minLength: 1, maxLength: 80 }
    RollCreate:
      type: object
      description: What to roll and why.
      additionalProperties: false
      required: [purpose, notation]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 120 }
        notation: { type: string, minLength: 2, maxLength: 80, pattern: "^[0-9dDkKhHlL+\\- ]+$" }
        labels:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/GroupLabel" }
        modifiers:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/RollModifier" }
        rollerId: { $ref: "#/components/schemas/Id" }
    DieFill:
      type: object
      description: Roll the die on the server, or enter the face of a physical die.
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [auto, manual] }
        value: { type: integer, format: int32, minimum: 1, maximum: 100 }
    DiceGroup:
      type: object
      description: A group of identical dice and which of them count.
      additionalProperties: false
      required: [index, count, faces, sign]
      properties:
        index: { type: integer, format: int32, minimum: 0, maximum: 5 }
        label: { type: string, maxLength: 80 }
        count: { type: integer, format: int32, minimum: 1, maximum: 20 }
        faces: { type: integer, format: int32, minimum: 4, maximum: 100 }
        sign: { type: integer, format: int32, minimum: -1, maximum: 1 }
        keep: { type: string, enum: [highest, lowest] }
        keepCount: { type: integer, format: int32, minimum: 1, maximum: 19 }
    RollDie:
      type: object
      description: One die of a Roll Request.
      additionalProperties: false
      required: [no, group, faces, kept]
      properties:
        no: { type: integer, format: int32, minimum: 0, maximum: 119 }
        group: { type: integer, format: int32, minimum: 0, maximum: 5 }
        faces: { type: integer, format: int32, minimum: 4, maximum: 100 }
        value: { type: integer, format: int32, minimum: 1, maximum: 100 }
        mode: { type: string, enum: [auto, manual] }
        kept: { type: boolean }
    MemberRef:
      type: object
      description: A Member by id and name.
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/DisplayName" }
    RollRequest:
      type: object
      description: A Roll Request with exactly what to throw and every modifier source.
      additionalProperties: false
      required: [id, purpose, notation, requestedBy, roller, mine, canRoll, status, groups, dice, modifiers, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        purpose: { type: string, maxLength: 120 }
        notation: { type: string, maxLength: 80 }
        requestedBy: { $ref: "#/components/schemas/DisplayName" }
        roller: { $ref: "#/components/schemas/MemberRef" }
        mine: { type: boolean }
        canRoll: { type: boolean }
        status: { type: string, enum: [pending, resolved] }
        total: { type: integer, format: int32, minimum: -10000, maximum: 10000 }
        groups:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/DiceGroup" }
        dice:
          type: array
          maxItems: 120
          items: { $ref: "#/components/schemas/RollDie" }
        modifiers:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/RollModifier" }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        resolvedAt: { type: string, format: date-time, maxLength: 40 }
    ActionEntry:
      type: object
      description: One entry of the Action Log.
      additionalProperties: false
      required: [seq, kind, actor, origin, value, createdAt]
      properties:
        seq: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        kind: { type: string, enum: [roll_requested, die_rolled, die_entered, roll_resolved] }
        actor: { $ref: "#/components/schemas/DisplayName" }
        origin: { type: string, enum: [ui, mcp, generator, system] }
        client: { type: string, maxLength: 80 }
        seed: { type: string, maxLength: 20, pattern: "^[0-9]+$" }
        rollId: { $ref: "#/components/schemas/Id" }
        dieNo: { type: integer, format: int32, minimum: 0, maximum: 119 }
        value: { type: integer, format: int32, minimum: -10000, maximum: 10000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
    HexCoord:
      type: object
      description: An axial hex coordinate.
      additionalProperties: false
      required: [q, r]
      properties:
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
    HexCell:
      type: object
      description: One hex of a local map.
      additionalProperties: false
      required: [q, r]
      properties:
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        difficult: { type: boolean }
        blocked: { type: boolean }
        blocksSight: { type: boolean }
        elevationFt: { type: integer, format: int32, minimum: -1000, maximum: 1000 }
        cover: { $ref: "#/components/schemas/CoverLevel" }
    CoverLevel:
      type: string
      description: How much of a target is hidden.
      enum: [none, half, three_quarters, total]
    HexOccupant:
      type: object
      description: A creature in a hex, as the mover sees it.
      additionalProperties: false
      required: [q, r, side]
      properties:
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        side: { type: string, enum: [ally, enemy] }
    ReachRequest:
      type: object
      description: A map, a mover and optionally a target hex.
      additionalProperties: false
      required: [cells, from, speedFt]
      properties:
        cells:
          type: array
          maxItems: 4000
          items: { $ref: "#/components/schemas/HexCell" }
        occupants:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/HexOccupant" }
        from: { $ref: "#/components/schemas/HexCoord" }
        to: { $ref: "#/components/schemas/HexCoord" }
        speedFt: { type: integer, format: int32, minimum: 0, maximum: 500 }
        climbSpeed: { type: boolean }
    ReachHex:
      type: object
      description: A reachable hex with its cost and where it is reached from.
      additionalProperties: false
      required: [q, r, costFt, canEnd, from]
      properties:
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        costFt: { type: integer, format: int32, minimum: 0, maximum: 500 }
        canEnd: { type: boolean }
        from: { $ref: "#/components/schemas/HexCoord" }
    ReachPreview:
      type: object
      description: The reachable hexes, and the path to the target when there is one.
      additionalProperties: false
      required: [hexes]
      properties:
        hexes:
          type: array
          maxItems: 4000
          items: { $ref: "#/components/schemas/ReachHex" }
        path:
          type: array
          maxItems: 4000
          items: { $ref: "#/components/schemas/HexCoord" }
        pathCostFt: { type: integer, format: int32, minimum: 0, maximum: 500 }
    SightRequest:
      type: object
      description: A map and two hexes.
      additionalProperties: false
      required: [cells, from, to]
      properties:
        cells:
          type: array
          maxItems: 4000
          items: { $ref: "#/components/schemas/HexCell" }
        occupants:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/HexOccupant" }
        from: { $ref: "#/components/schemas/HexCoord" }
        to: { $ref: "#/components/schemas/HexCoord" }
    SightPreview:
      type: object
      description: What one hex sees of another.
      additionalProperties: false
      required: [visible, cover, acBonus]
      properties:
        visible: { type: boolean }
        cover: { $ref: "#/components/schemas/CoverLevel" }
        acBonus: { type: integer, format: int32, minimum: 0, maximum: 5 }
    PlaySession:
      type: object
      description: One evening of play.
      additionalProperties: false
      required: [id, number, status, seq, gridRadius, startedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        number: { type: integer, format: int32, minimum: 1, maximum: 100000 }
        status: { type: string, enum: [live, ended] }
        seq: { type: integer, format: int32, minimum: 0, maximum: 2147483647 }
        gridRadius: { type: integer, format: int32, minimum: 1, maximum: 60 }
        startedAt: { type: string, format: date-time, maxLength: 40 }
        endedAt: { type: string, format: date-time, maxLength: 40 }
    TokenKind:
      type: string
      description: What a Token stands for.
      enum: [party, enemy, npc, object]
    LiveToken:
      type: object
      description: A Token as a connection sees it.
      additionalProperties: false
      required: [id, label, kind, q, r, hidden, darkvisionFt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        label: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: "#/components/schemas/TokenKind" }
        darkvisionFt: { type: integer, format: int32, minimum: 0, maximum: 300 }
        q: { type: integer, format: int32, minimum: -500, maximum: 500 }
        r: { type: integer, format: int32, minimum: -500, maximum: 500 }
        hidden: { type: boolean }
        controllerId: { $ref: "#/components/schemas/Id" }
        ac: { type: integer, format: int32, minimum: 0, maximum: 40 }
        hp: { type: integer, format: int32, minimum: 0, maximum: 10000 }
        hpMax: { type: integer, format: int32, minimum: 1, maximum: 10000 }
        health:
          type: string
          description: What anyone can tell by looking, for creatures whose hit points the audience may not see.
          enum: [unhurt, hurt, bloodied, down]
        attacks:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LiveAttack" }
        shield: { type: boolean }
        effects:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/LiveEffect" }
    LiveAttack:
      type: object
      description: One attack on a token's hotbar.
      additionalProperties: false
