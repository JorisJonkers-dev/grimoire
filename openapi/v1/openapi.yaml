        labels:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/GroupLabel" }
        modifiers:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/RollModifier" }
        rollerId: { $ref: "#/components/schemas/Id" }
    DieFill:
      type: object
      description: Roll the die on the server, or enter the face of a physical die.
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [auto, manual] }
        value: { type: integer, format: int32, minimum: 1, maximum: 100 }
    DiceGroup:
      type: object
      description: A group of identical dice and which of them count.
      additionalProperties: false
      required: [index, count, faces, sign]
      properties:
        index: { type: integer, format: int32, minimum: 0, maximum: 5 }
        label: { type: string, maxLength: 80 }
        count: { type: integer, format: int32, minimum: 1, maximum: 20 }
        faces: { type: integer, format: int32, minimum: 4, maximum: 100 }
        sign: { type: integer, format: int32, minimum: -1, maximum: 1 }
        keep: { type: string, enum: [highest, lowest] }
        keepCount: { type: integer, format: int32, minimum: 1, maximum: 19 }
    RollDie:
      type: object
      description: One die of a Roll Request.
      additionalProperties: false
      required: [no, group, faces, kept]
      properties:
        no: { type: integer, format: int32, minimum: 0, maximum: 119 }
        group: { type: integer, format: int32, minimum: 0, maximum: 5 }
        faces: { type: integer, format: int32, minimum: 4, maximum: 100 }
        value: { type: integer, format: int32, minimum: 1, maximum: 100 }
        mode: { type: string, enum: [auto, manual] }
        kept: { type: boolean }
    MemberRef:
      type: object
      description: A Member by id and name.
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/DisplayName" }
    RollRequest:
      type: object
      description: A Roll Request with exactly what to throw and every modifier source.
      additionalProperties: false
      required: [id, purpose, notation, requestedBy, roller, mine, canRoll, status, groups, dice, modifiers, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        purpose: { type: string, maxLength: 120 }
        notation: { type: string, maxLength: 80 }
        requestedBy: { $ref: "#/components/schemas/DisplayName" }
        roller: { $ref: "#/components/schemas/MemberRef" }
        mine: { type: boolean }
        canRoll: { type: boolean }
        status: { type: string, enum: [pending, resolved] }
        total: { type: integer, format: int32, minimum: -10000, maximum: 10000 }
        groups:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/DiceGroup" }
        dice:
          type: array
          maxItems: 120
          items: { $ref: "#/components/schemas/RollDie" }
        modifiers:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/RollModifier" }
        createdAt: { type: string, format: date-time, maxLength: 40 }
        resolvedAt: { type: string, format: date-time, maxLength: 40 }
    ActionEntry:
      type: object
      description: One entry of the Action Log.
      additionalProperties: false
      required: [seq, kind, actor, origin, value, createdAt]
      properties:
        seq: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        kind: { type: string, enum: [roll_requested, die_rolled, die_entered, roll_resolved] }
        actor: { $ref: "#/components/schemas/DisplayName" }
        origin: { type: string, enum: [ui, mcp, generator, system] }
        client: { type: string, maxLength: 80 }
        seed: { type: string, maxLength: 20, pattern: "^[0-9]+$" }
        rollId: { $ref: "#/components/schemas/Id" }
        dieNo: { type: integer, format: int32, minimum: 0, maximum: 119 }
        value: { type: integer, format: int32, minimum: -10000, maximum: 10000 }
        createdAt: { type: string, format: date-time, maxLength: 40 }
    HexCoord:
      type: object
