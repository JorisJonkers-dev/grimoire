        id: { $ref: "#/components/schemas/Id" }
        title: { type: string, maxLength: 80 }
        members:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Person" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
        unread: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        lastBody: { type: string, maxLength: 120 }
    ConversationList:
      type: object
      description: An Account's Conversations.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ConversationEntry" }
    ConversationStart:
      type: object
      description: The Friends to talk with, and a title for a group.
      additionalProperties: false
      required: [with]
      properties:
        with:
          type: array
          minItems: 1
          maxItems: 9
          items: { $ref: "#/components/schemas/Id" }
        title: { type: string, maxLength: 80 }
    ConversationRef:
      type: object
      description: A Conversation's id.
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/Id" }
    Mentionable:
      type: object
      description: Something the caller may mention.
      additionalProperties: false
      required: [kind, id, name, campaignId, campaignName]
      properties:
        kind: { $ref: "#/components/schemas/MentionKind" }
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 120 }
        campaignId: { $ref: "#/components/schemas/Id" }
        campaignName: { type: string, maxLength: 80 }
    MentionableList:
      type: object
      description: What the caller may mention.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/Mentionable" }
    ReleaseNote:
      type: object
