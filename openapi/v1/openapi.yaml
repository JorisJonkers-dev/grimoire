        priceCp: { type: integer, format: int32, minimum: 1, maximum: 2000000000 }
    Shop:
      type: object
      description: A trader in a Settlement with its Stock; stockedDay is the in-game day it last restocked.
      additionalProperties: false
      required: [id, settlementId, name, kind, markupPct, haggleDc, hagglePct, restock, stockedDay, stock, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        settlementId: { $ref: "#/components/schemas/Id" }
        name: { type: string, maxLength: 80 }
        kind: { type: string, maxLength: 40 }
        ownerId: { $ref: "#/components/schemas/Id" }
        markupPct: { type: integer, format: int32, minimum: 0, maximum: 300 }
        haggleDc: { type: integer, format: int32, minimum: 5, maximum: 30 }
        hagglePct: { type: integer, format: int32, minimum: 0, maximum: 50 }
        lootTableId: { $ref: "#/components/schemas/Id" }
        restock: { $ref: "#/components/schemas/ShopRestock" }
        restockDays: { type: integer, format: int32, minimum: 1, maximum: 365 }
        stockedDay: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
        stock:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/StockItem" }
        updatedAt: { type: string, format: date-time, maxLength: 40 }
    Revision:
